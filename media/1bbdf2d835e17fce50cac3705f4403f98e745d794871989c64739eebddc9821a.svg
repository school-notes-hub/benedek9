<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Két azonos irányú vektor összeadása: 3 km keletre, majd az első végétől 2 km keletre; az összeg az első kezdőpontjából a második végpontjába mutat, 5 km keletre</title>
<defs>
<marker id="mb" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L15,8 L0,15 z" fill="#175e96"/></marker>
<marker id="mo" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L15,8 L0,15 z" fill="#c4561c"/></marker>
<marker id="mg" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L15,8 L0,15 z" fill="#1d7a43"/></marker>
<marker id="mk" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#4a5568"/></marker>
</defs>
<rect width="420" height="300" rx="16" fill="#f5f8fb"/>
<text x="210" y="34" font-size="20" font-weight="700" fill="#16283b" text-anchor="middle">Azonos irányú vektorok összege</text>
<line x1="330" y1="66" x2="392" y2="66" stroke="#4a5568" stroke-width="2" marker-end="url(#mk)"/>
<text x="328" y="71" font-size="14" fill="#4a5568" text-anchor="end">kelet</text>
<line x1="40" y1="130" x2="229" y2="130" stroke="#175e96" stroke-width="5" marker-end="url(#mb)"/>
<line x1="232" y1="130" x2="357" y2="130" stroke="#c4561c" stroke-width="5" marker-end="url(#mo)"/>
<circle cx="40" cy="130" r="5" fill="#16283b"/>
<text x="136.0" y="114" font-size="15" font-weight="700" fill="#175e96" text-anchor="middle">1.: 3 km keletre</text>
<text x="296.0" y="114" font-size="15" font-weight="700" fill="#c4561c" text-anchor="middle">2.: 2 km keletre</text>
<text x="232" y="156" font-size="14" fill="#4a5568" text-anchor="middle">a 2. az 1. végéről indul</text>
<line x1="40" y1="136" x2="40" y2="210" stroke="#7a8796" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="360" y1="136" x2="360" y2="210" stroke="#7a8796" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="40" y1="210" x2="357" y2="210" stroke="#1d7a43" stroke-width="5" stroke-dasharray="14 8" marker-end="url(#mg)"/>
<circle cx="40" cy="210" r="5" fill="#16283b"/>
<text x="200.0" y="240" font-size="16" font-weight="700" fill="#1d7a43" text-anchor="middle">összeg: 5 km keletre</text>
<line x1="40" y1="270" x2="104" y2="270" stroke="#16283b" stroke-width="3"/>
<line x1="40" y1="263" x2="40" y2="277" stroke="#16283b" stroke-width="2"/>
<line x1="104" y1="263" x2="104" y2="277" stroke="#16283b" stroke-width="2"/>
<text x="114" y="275" font-size="14" fill="#16283b">= 1 km</text>
</svg>