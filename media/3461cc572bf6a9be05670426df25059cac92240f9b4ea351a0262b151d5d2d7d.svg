<g transform="translate(410,0)"><circle cx="0" cy="130" r="52" fill="#f0a830"/><rect x="-18" y="122" width="36" height="34" rx="8" fill="#fff"/><g fill="#fff"><rect x="-18" y="98" width="8" height="30" rx="4"/><rect x="-7" y="92" width="8" height="34" rx="4"/><rect x="4" y="95" width="8" height="32" rx="4"/><rect x="15" y="104" width="7" height="24" rx="3"/></g><text x="0" y="220" text-anchor="middle" font-size="17" font-weight="800" fill="#23395d">taktilis</text><text x="0" y="242" text-anchor="middle" font-size="13" fill="#555">tapintással</text></g>
<g transform="translate(560,0)"><circle cx="0" cy="130" r="52" fill="#2ea99a"/><path d="M-4,100 q-4,30 -16,42 q10,8 20,4 q10,4 20,-4 q-12,-12 -16,-42 z" fill="#fff"/><text x="0" y="220" text-anchor="middle" font-size="17" font-weight="800" fill="#23395d">szaglással</text><text x="0" y="242" text-anchor="middle" font-size="13" fill="#555">(olfaktorikus)</text></g>
