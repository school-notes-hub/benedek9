<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 670" width="440" height="670" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="A szükségletek csoportosítása három szempont szerint: fontosság szerint létszükséglet, kulturális és luxusszükséglet; kielégíthetőség szerint teljes, effektív és látens szükséglet; jelleg szerint egyéni és társadalmi szükséglet">
  <rect width="440" height="670" rx="16" fill="#fdfaf3"/>
  <line x1="22" y1="37" x2="22" y2="522" stroke="#566573" stroke-width="3"/><line x1="22" y1="37" x2="120" y2="37" stroke="#566573" stroke-width="3"/>
  <rect x="120" y="14" width="200" height="46" rx="12" fill="#145a32"/><text x="220" y="44" font-size="22" font-weight="bold" fill="#fff" text-anchor="middle">Szükségletek</text>
  <rect x="40" y="80" width="390" height="190" rx="14" fill="#eafaf1" stroke="#1e8449" stroke-width="2.5"/><line x1="22" y1="102" x2="40" y2="102" stroke="#566573" stroke-width="3"/><circle cx="22" cy="102" r="5" fill="#566573"/><text x="56" y="109" font-size="20" font-weight="bold" fill="#1e8449">Fontosság szerint</text><text x="56" y="130" font-size="14" font-style="italic" fill="#34495e">Mennyire nélkülözhetetlen?</text><rect x="54" y="142" width="148" height="30" rx="15" fill="#1e8449"/><text x="128" y="163" font-size="15.5" font-weight="bold" fill="#fff" text-anchor="middle">Létszükséglet</text><text x="212" y="162" font-size="14.5" fill="#2c3e50">pl. élelem, lakás, víz</text><rect x="54" y="182" width="148" height="30" rx="15" fill="#1e8449"/><text x="128" y="203" font-size="15.5" font-weight="bold" fill="#fff" text-anchor="middle">Kulturális</text><text x="212" y="202" font-size="14.5" fill="#2c3e50">pl. utazás, könyv, színház</text><rect x="54" y="222" width="148" height="30" rx="15" fill="#1e8449"/><text x="128" y="243" font-size="15.5" font-weight="bold" fill="#fff" text-anchor="middle">Luxusszükséglet</text><text x="212" y="242" font-size="14.5" fill="#2c3e50">pl. luxusautó, luxusóra</text><rect x="40" y="290" width="390" height="190" rx="14" fill="#ebf5fb" stroke="#2471a3" stroke-width="2.5"/><line x1="22" y1="312" x2="40" y2="312" stroke="#566573" stroke-width="3"/><circle cx="22" cy="312" r="5" fill="#566573"/><text x="56" y="319" font-size="20" font-weight="bold" fill="#2471a3">Kielégíthetőség szerint</text><text x="56" y="340" font-size="14" font-style="italic" fill="#34495e">Ki tudjuk-e fizetni?</text><rect x="54" y="352" width="148" height="30" rx="15" fill="#2471a3"/><text x="128" y="373" font-size="15.5" font-weight="bold" fill="#fff" text-anchor="middle">Teljes</text><text x="212" y="372" font-size="14.5" fill="#2c3e50">az összes igény</text><rect x="54" y="392" width="148" height="30" rx="15" fill="#2471a3"/><text x="128" y="413" font-size="15.5" font-weight="bold" fill="#fff" text-anchor="middle">Effektív</text><text x="212" y="412" font-size="14.5" fill="#2c3e50">tényleges, kifizethető</text><rect x="54" y="432" width="148" height="30" rx="15" fill="#2471a3"/><text x="128" y="453" font-size="15.5" font-weight="bold" fill="#fff" text-anchor="middle">Látens</text><text x="212" y="452" font-size="14.5" fill="#2c3e50">rejtett: nincs rá pénz</text><rect x="40" y="500" width="390" height="150" rx="14" fill="#fdf2e9" stroke="#ca6f1e" stroke-width="2.5"/><line x1="22" y1="522" x2="40" y2="522" stroke="#566573" stroke-width="3"/><circle cx="22" cy="522" r="5" fill="#566573"/><text x="56" y="529" font-size="20" font-weight="bold" fill="#ca6f1e">Jelleg szerint</text><text x="56" y="550" font-size="14" font-style="italic" fill="#34495e">Egy embernek vagy közösen?</text><rect x="54" y="562" width="148" height="30" rx="15" fill="#ca6f1e"/><text x="128" y="583" font-size="15.5" font-weight="bold" fill="#fff" text-anchor="middle">Egyéni</text><text x="212" y="582" font-size="14.5" fill="#2c3e50">pl. kakaós csigát eszel</text><rect x="54" y="602" width="148" height="30" rx="15" fill="#ca6f1e"/><text x="128" y="623" font-size="15.5" font-weight="bold" fill="#fff" text-anchor="middle">Társadalmi</text><text x="212" y="622" font-size="14.5" fill="#2c3e50">pl. híd a Tiszán, oktatás</text>
</svg>