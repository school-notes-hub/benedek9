<svg xmlns="http://www.w3.org/2000/svg" width="400" height="530" viewBox="0 0 400 530" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>400 000 Ft bruttó bér felbontása három esetben</title>
<rect width="400" height="530" rx="16" fill="#f7f9fc"/>
<text x="200" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#23395d">Hová megy a 400 000 Ft bruttó bér?</text>
<line x1="10" y1="92" x2="390" y2="92" stroke="#44516a" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="390" y="84" text-anchor="end" font-size="14" fill="#44516a">400 000 Ft bruttó</text>
<rect x="10" y="92.0" width="104" height="48.1" fill="#e9a23b" stroke="#fff" stroke-width="2"/>
<text x="62" y="121.5" text-anchor="middle" font-size="15" font-weight="700" fill="#3b2a00">TB 74 000</text>
<rect x="10" y="140.1" width="104" height="39.0" fill="#d9534f" stroke="#fff" stroke-width="2"/>
<text x="62" y="165.0" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">SZJA 60 000</text>
<rect x="10" y="179.1" width="104" height="172.9" fill="#2a8c7e" stroke="#fff" stroke-width="2"/>
<text x="62" y="261.3" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">nettó</text>
<text x="62" y="281.3" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">266 000</text>
<text x="62" y="376" text-anchor="middle" font-size="14" font-weight="700" fill="#23395d">25 éves</text>
<text x="62" y="395" text-anchor="middle" font-size="14" font-weight="400" fill="#23395d">vagy idősebb,</text>
<text x="62" y="414" text-anchor="middle" font-size="14" font-weight="400" fill="#23395d">munkaviszonyban</text>
<rect x="148" y="92.0" width="104" height="48.1" fill="#e9a23b" stroke="#fff" stroke-width="2"/>
<text x="200" y="121.5" text-anchor="middle" font-size="15" font-weight="700" fill="#3b2a00">TB 74 000</text>
<rect x="148" y="140.1" width="104" height="211.9" fill="#2a8c7e" stroke="#fff" stroke-width="2"/>
<text x="200" y="241.8" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">nettó</text>
<text x="200" y="261.8" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">326 000</text>
<text x="200" y="376" text-anchor="middle" font-size="14" font-weight="700" fill="#23395d">25 év alatti,</text>
<text x="200" y="395" text-anchor="middle" font-size="14" font-weight="400" fill="#23395d">munkaviszonyban</text>
<rect x="286" y="92.0" width="104" height="260.0" fill="#2a8c7e" stroke="#fff" stroke-width="2"/>
<text x="338" y="197.8" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">nettó</text>
<text x="338" y="217.8" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">400 000</text>
<text x="338" y="236.0" text-anchor="middle" font-size="14" font-weight="400" fill="#fff">nincs TB,</text>
<text x="338" y="254.0" text-anchor="middle" font-size="14" font-weight="400" fill="#fff">nincs SZJA</text>
<text x="338" y="376" text-anchor="middle" font-size="14" font-weight="700" fill="#23395d">25 év alatti diák,</text>
<text x="338" y="395" text-anchor="middle" font-size="14" font-weight="400" fill="#23395d">nappali tagozatos,</text>
<text x="338" y="414" text-anchor="middle" font-size="14" font-weight="400" fill="#23395d">iskolaszövetkezet</text>
<rect x="14" y="439" width="16" height="16" rx="3" fill="#2a8c7e"/>
<text x="36" y="452" font-size="14" fill="#23395d">nettó (kézhez)</text>
<rect x="148" y="439" width="16" height="16" rx="3" fill="#d9534f"/>
<text x="170" y="452" font-size="14" fill="#23395d">SZJA 15%</text>
<rect x="252" y="439" width="16" height="16" rx="3" fill="#e9a23b"/>
<text x="274" y="452" font-size="14" fill="#23395d">TB-járulék 18,5%</text>
<text x="200" y="486" text-anchor="middle" font-size="14" fill="#44516a">2026-os kulcsok; más kedvezmény</text>
<text x="200" y="505" text-anchor="middle" font-size="14" fill="#44516a">és levonás nélkül</text>
</svg>