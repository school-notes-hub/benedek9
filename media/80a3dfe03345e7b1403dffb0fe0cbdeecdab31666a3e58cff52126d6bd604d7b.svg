<svg xmlns="http://www.w3.org/2000/svg" width="440" height="580" viewBox="0 0 440 580" role="img"><title>Fent V ⊆ U: V teljesen U-ban van. Lent V ⊂ U: V elemei 2, 3, 5, 7, és U-ban V-n kívül egy további elemet jelző pont is van.</title>
<rect x="0" y="0" width="440" height="580" rx="12" fill="#fff"/>
<g font-family="DejaVu Sans, sans-serif" fill="#15354d" text-anchor="middle">
<text x="220" y="40" font-size="28">Részhalmaz: V ⊆ U</text>
<ellipse cx="220" cy="152" rx="160" ry="85" fill="#f4f7fa" stroke="#15354d" stroke-width="3"/>
<ellipse cx="195" cy="153" rx="105" ry="52" fill="#e0f2f2" stroke="#15354d" stroke-width="3"/>
<text x="338" y="161" font-size="26" font-weight="bold">U</text>
<text x="130" y="161" font-size="26" font-weight="bold">V</text>
<text x="220" y="288" font-size="28">Valódi részhalmaz: V ⊂ U</text>
<ellipse cx="220" cy="417" rx="160" ry="96" fill="#f4f7fa" stroke="#15354d" stroke-width="3"/>
<ellipse cx="190" cy="408" rx="102" ry="60" fill="#e0f2f2" stroke="#15354d" stroke-width="3"/>
<text x="338" y="411" font-size="26" font-weight="bold">U</text>
<text x="128" y="389" font-size="26" font-weight="bold">V</text>
<text x="200" y="436" font-size="25">2, 3, 5, 7</text>
<circle cx="335" cy="447" r="5" fill="#15354d"/>
<text x="220" y="553" font-size="23">U-nak V-n kívül is van eleme.</text>
</g></svg>