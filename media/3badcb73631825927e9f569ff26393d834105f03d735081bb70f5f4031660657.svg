<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Mértékegység-lépcső: lefelé szorzunk, felfelé osztunk</title>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="820" height="520" rx="18" fill="#fffaf0"/>
<text x="410.0" y="44" text-anchor="middle" font-size="26" font-weight="800" fill="#3b2f2f">A mértékegység-lépcső</text>
<text x="410.0" y="72" text-anchor="middle" font-size="15" fill="#6b5b53">lefelé lépve szorzunk, felfelé lépve osztunk</text>
<rect x="40" y="110" width="94" height="322" rx="8" fill="#e25c4b"/>
<text x="87.0" y="142" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">km</text>
<path d="M110,104 q30,-10 45,34" fill="none" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<text x="142" y="102" font-size="13" font-weight="700" fill="#333">·10</text>
<rect x="140" y="156" width="94" height="276" rx="8" fill="#f0873a"/>
<text x="187.0" y="188" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">hm</text>
<path d="M210,150 q30,-10 45,34" fill="none" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<text x="242" y="148" font-size="13" font-weight="700" fill="#333">·10</text>
<rect x="240" y="202" width="94" height="230" rx="8" fill="#f0a830"/>
<text x="287.0" y="234" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">dam</text>
<path d="M310,196 q30,-10 45,34" fill="none" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<text x="342" y="194" font-size="13" font-weight="700" fill="#333">·10</text>
<rect x="340" y="248" width="94" height="184" rx="8" fill="#2ea99a"/>
<text x="387.0" y="280" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">m</text>
<path d="M410,242 q30,-10 45,34" fill="none" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<text x="442" y="240" font-size="13" font-weight="700" fill="#333">·10</text>
<rect x="440" y="294" width="94" height="138" rx="8" fill="#3f7fd6"/>
<text x="487.0" y="326" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">dm</text>
<path d="M510,288 q30,-10 45,34" fill="none" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<text x="542" y="286" font-size="13" font-weight="700" fill="#333">·10</text>
<rect x="540" y="340" width="94" height="92" rx="8" fill="#6a5acd"/>
<text x="587.0" y="372" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">cm</text>
<path d="M610,334 q30,-10 45,34" fill="none" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<text x="642" y="332" font-size="13" font-weight="700" fill="#333">·10</text>
<rect x="640" y="386" width="94" height="46" rx="8" fill="#8e5cc7"/>
<text x="687.0" y="418" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">mm</text>
<g font-size="15" fill="#3b2f2f">
<text x="40" y="460" font-weight="700">Egy lépcsőfok váltószáma:</text>
<text x="40" y="482">hosszúság (m): <tspan font-weight="700">10</tspan>   ·   terület (m²): <tspan font-weight="700">100</tspan>   ·   térfogat (m³): <tspan font-weight="700">1000</tspan></text>
<text x="40" y="504">Példa: 3,7 cm = 0,37 dm (egy fokot fel: osztás 10-zel) · 9,2 m² = 920 dm² (egy fokot le: szorzás 100-zal)</text>
</g>
<text x="700" y="140" font-size="14" fill="#6b5b53" text-anchor="middle">a hm és a dam ritka,</text><text x="700" y="158" font-size="14" fill="#6b5b53" text-anchor="middle">de lépcsőfoknak számít</text>
</svg>