<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1116" viewBox="0 0 600 1116" role="img" aria-labelledby="title desc">
<title id="title">Az ókori Kelet időrendje</title>
<desc id="desc">Függőleges, időarányos idővonal fentről lefelé: Kr. e. 9000 körül növénytermesztés a Közel-Keleten (kihagyott évezredek után folytatódik); Kr. e. 4. évezred vége sumer városállamok; Kr. e. 3000 körül egységes Egyiptom; Kr. e. 2500 körül az Indus-völgyi városok virágkora; Kr. e. 18. század Hammurapi; Kr. e. 2. évezred az első kínai államok (sáv, amelybe a 18. század is beleesik); Kr. e. 7. század az első vert érmék; hagyományosan Kr. e. 6. század Buddha; Kr. e. 221 Kína egyesítése.</desc>
