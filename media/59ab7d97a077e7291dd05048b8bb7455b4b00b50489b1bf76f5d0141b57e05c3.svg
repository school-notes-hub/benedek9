<svg xmlns="http://www.w3.org/2000/svg" width="400" height="542" viewBox="0 0 400 542" role="img" aria-label="Négy sor egymás alatt, mindegyikben négy hely a négyjegyű kód vagy szám számjegyeinek: kód ismétléssel 10·10·10·10 = 10 000; kód ismétlés nélkül 10·9·8·7 = 5040; szám ismétléssel 9·10·10·10 = 9000; szám ismétlés nélkül 9·9·8·7 = 4536. A számoknál az első hely szaggatott narancs keretű (1–9), az utolsó sorban a második hely alatt: a 0 is.">
<title>Négy sor egymás alatt, mindegyikben négy hely a négyjegyű kód vagy szám számjegyeinek: kód ismétléssel 10·10·10·10 = 10 000; kód ismétlés nélkül 10·9·8·7 = 5040; szám ismétléssel 9·10·10·10 = 9000; szám ismétlés nélkül 9·9·8·7 = 4536. A számoknál az első hely szaggatott narancs keretű (1–9), az utolsó sorban a második hely alatt: a 0 is.</title>
