<svg xmlns="http://www.w3.org/2000/svg" width="400" height="346" viewBox="0 0 400 346" role="img" aria-label="Venn-diagram az U alaphalmazban két átfedő körrel, A és B. A kitöltés sorrendje: 1. a közös rész (mindkettő), 2. csak A és csak B, 3. a körökön kívüli rész (egyik sem).">
<title>Venn-diagram az U alaphalmazban két átfedő körrel, A és B. A kitöltés sorrendje: 1. a közös rész (mindkettő), 2. csak A és csak B, 3. a körökön kívüli rész (egyik sem).</title>
<rect width="400" height="346" rx="12" fill="#fffaf0"/>
<text x="200" y="28" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" font-style="normal" fill="#17283d">Kitöltés belülről kifelé</text>
<rect x="14" y="42" width="372" height="290" rx="8" fill="#eef3f8" stroke="#17283d" stroke-width="2.5"/>
<text x="28" y="68" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start" font-weight="bold" font-style="normal" fill="#17283d">U</text>
<g stroke-width="3" fill-opacity="0.3"><circle cx="145" cy="180" r="100" fill="#e74c3c" stroke="#b03a2e"/><circle cx="255" cy="180" r="100" fill="#3498db" stroke="#1f618d"/></g>
<text x="58" y="88" font-family="DejaVu Sans, sans-serif" font-size="20" text-anchor="middle" font-weight="bold" font-style="normal" fill="#b03a2e">A</text>
<text x="342" y="88" font-family="DejaVu Sans, sans-serif" font-size="20" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1f618d">B</text>
<circle cx="200" cy="170" r="14" fill="#7d3c98"/>
<text x="200" y="176" font-family="DejaVu Sans, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" font-style="normal" fill="#ffffff">1</text>
<text x="200" y="204" font-family="DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" font-style="normal" fill="#17283d">mindkettő</text>
<circle cx="95" cy="170" r="14" fill="#7d3c98"/>
<text x="95" y="176" font-family="DejaVu Sans, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" font-style="normal" fill="#ffffff">2</text>
<text x="95" y="204" font-family="DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" font-style="normal" fill="#17283d">csak A</text>
<circle cx="305" cy="170" r="14" fill="#7d3c98"/>
<text x="305" y="176" font-family="DejaVu Sans, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" font-style="normal" fill="#ffffff">2</text>
<text x="305" y="204" font-family="DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" font-style="normal" fill="#17283d">csak B</text>
<circle cx="350" cy="290" r="14" fill="#7d3c98"/>
<text x="350" y="296" font-family="DejaVu Sans, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" font-style="normal" fill="#ffffff">3</text>
<text x="345" y="322" font-family="DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" font-style="normal" fill="#17283d">egyik sem</text>
</svg>