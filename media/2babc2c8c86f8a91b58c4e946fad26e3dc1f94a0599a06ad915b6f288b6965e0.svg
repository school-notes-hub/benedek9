<g id="node2" class="node">
<title>kezai</title>
<path fill="#e1f1e9" stroke="#bcbaa9" d="M326,-542C326,-542 26,-542 26,-542 20,-542 14,-536 14,-530 14,-530 14,-306 14,-306 14,-300 20,-294 26,-294 26,-294 326,-294 326,-294 332,-294 338,-300 338,-306 338,-306 338,-530 338,-530 338,-536 332,-542 326,-542"/>
<text text-anchor="middle" x="176" y="-514" font-family="DejaVu Sans" font-size="20.00" fill="#203c3c">KÉZAI SIMON</text>
<text text-anchor="middle" x="176" y="-492" font-family="DejaVu Sans" font-size="20.00" fill="#203c3c">Gesta Hunnorum</text>
<text text-anchor="middle" x="176" y="-470" font-family="DejaVu Sans" font-size="20.00" fill="#203c3c">et Hungarorum</text>
<text text-anchor="middle" x="176" y="-448" font-family="DejaVu Sans" font-size="20.00" fill="#203c3c">(röviden: Gesta Hungarorum)</text>
<text text-anchor="middle" x="176" y="-402" font-family="DejaVu Sans" font-size="20.00" fill="#203c3c">Hunor és Magor</text>
<text text-anchor="middle" x="176" y="-380" font-family="DejaVu Sans" font-size="20.00" fill="#203c3c">szarvasvadászata</text>
<text text-anchor="middle" x="176" y="-334" font-family="DejaVu Sans" font-size="20.00" fill="#203c3c">A testvéreket szarvasünő</text>
<text text-anchor="middle" x="176" y="-312" font-family="DejaVu Sans" font-size="20.00" fill="#203c3c">vezeti új lakóhelyre.</text>
</g>


<g id="node3" class="node">
