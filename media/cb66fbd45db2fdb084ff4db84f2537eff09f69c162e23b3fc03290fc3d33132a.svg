<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>400 000 Ft bruttó bér felbontása kedvezmény nélkül és a 25 év alatti kedvezménnyel</title>
<rect width="820" height="470" rx="18" fill="#f7f9fc"/>
<text x="410" y="40" text-anchor="middle" font-size="24" font-weight="800" fill="#23395d">Hová megy a 400 000 Ft bruttó bér?</text>
<line x1="120" y1="80" x2="620" y2="80" stroke="#999" stroke-dasharray="6 5"/><text x="628" y="85" font-size="14" fill="#555">400 000 Ft bruttó</text>
<rect x="170" y="180.5" width="150" height="199.5" fill="#2ea99a"/>
<text x="245" y="286.2" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">nettó 266 000</text>
<rect x="170" y="135.5" width="150" height="45.0" fill="#e25c4b"/>
<text x="245" y="164.0" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">SZJA 60 000</text>
<rect x="170" y="80.0" width="150" height="55.5" fill="#f0a830"/>
<text x="245" y="113.8" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">TB 74 000</text>
<text x="245" y="410" text-anchor="middle" font-size="14" font-weight="800" fill="#23395d">Kedvezmény nélkül</text>
<rect x="420" y="135.5" width="150" height="244.5" fill="#2ea99a"/>
<text x="495" y="263.8" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">nettó 326 000</text>
<rect x="420" y="80.0" width="150" height="55.5" fill="#f0a830"/>
<text x="495" y="113.8" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">TB 74 000</text>
<text x="495" y="410" text-anchor="middle" font-size="14" font-weight="800" fill="#23395d">25 év alatti kedvezménnyel</text>
<g font-size="14" fill="#333"><rect x="628" y="200" width="16" height="16" fill="#2ea99a"/><text x="652" y="213">nettó (kézhez)</text><rect x="628" y="228" width="16" height="16" fill="#e25c4b"/><text x="652" y="241">SZJA 15%</text><rect x="628" y="256" width="16" height="16" fill="#f0a830"/><text x="652" y="269">TB-járulék 18,5%</text></g>
<text x="410" y="448" text-anchor="middle" font-size="13" fill="#555">Munkaviszony, 2026; teljes SZJA-kedvezmény a jobb oldalon; más kedvezmény és levonás nélkül</text>
</svg>