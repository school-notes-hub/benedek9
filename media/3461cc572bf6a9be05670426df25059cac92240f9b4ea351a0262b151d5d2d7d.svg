<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 280" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>A kommunikáció közvetítő közegei: látás, hallás, tapintás, szaglás, ízlelés</title>
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect width="820" height="280" rx="18" fill="#fbfaff"/>
<text x="410" y="44" text-anchor="middle" font-size="24" font-weight="800" fill="#23395d">Milyen érzékszervvel fogjuk fel az üzenetet?</text>
<g transform="translate(110,0)"><circle cx="0" cy="130" r="52" fill="#3f7fd6"/><ellipse cx="0" cy="130" rx="32" ry="18" fill="#fff"/><circle cx="0" cy="130" r="11" fill="#23395d"/><text x="0" y="220" text-anchor="middle" font-size="17" font-weight="800" fill="#23395d">vizuális</text><text x="0" y="242" text-anchor="middle" font-size="13" fill="#555">látással</text></g>
