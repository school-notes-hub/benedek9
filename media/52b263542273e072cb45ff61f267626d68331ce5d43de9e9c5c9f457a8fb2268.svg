<svg xmlns="http://www.w3.org/2000/svg" width="600" height="731" viewBox="0 0 600 731" role="img" aria-labelledby="title desc">
<title id="title">Kréta és Mükéné</title>
<desc id="desc">Tájékozódási térkép mai partvonallal. Az Égei-tenger déli peremén Kréta, rajta Knósszosz; a görög szárazföldön, a Peloponnészoszon Mükéné; Krétától északra Théra (Szantorini). Szaggatott nyilak Krétától Egyiptom és a Közel-Kelet felé: a kereskedelmi kapcsolatok iránya.</desc>
<rect width="600" height="731" fill="#fffdf7"/>
<g font-family="DejaVu Sans, Verdana, sans-serif">
