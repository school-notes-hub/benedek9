<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" width="520" height="380" role="img" aria-label="Öt csúcsú gráf öt éllel: a 3 fokú csúcs össze van kötve az 1 fokú csúccsal és egy négyszög két szomszédos csúcsával; a négyszög másik két csúcsa 2 fokú">
  <rect width="520" height="380" rx="16" fill="#fdfaf3"/>
  <text x="260" y="34" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">5 üzletember, ismeretségek: 1, 2, 2, 2, 3</text>
  <g stroke="#34495e" stroke-width="4" stroke-linecap="round">
    <line x1="260" y1="90" x2="110" y2="150"/>
    <line x1="260" y1="90" x2="380" y2="150"/>
    <line x1="260" y1="90" x2="190" y2="270"/>
    <line x1="380" y1="150" x2="360" y2="270"/>
    <line x1="190" y1="270" x2="360" y2="270"/>
  </g>
  <g font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#fff">
    <circle cx="260" cy="90" r="22" fill="#e74c3c"/><text x="260" y="97">3</text>
    <circle cx="110" cy="150" r="22" fill="#3498db"/><text x="110" y="157">1</text>
    <circle cx="380" cy="150" r="22" fill="#27ae60"/><text x="380" y="157">2</text>
    <circle cx="190" cy="270" r="22" fill="#27ae60"/><text x="190" y="277">2</text>
    <circle cx="360" cy="270" r="22" fill="#27ae60"/><text x="360" y="277">2</text>
  </g>
  <text x="260" y="325" font-family="sans-serif" font-size="17" text-anchor="middle" fill="#2c3e50">a körben: hány ismerőse van (fokszám)</text>
  <text x="260" y="352" font-family="sans-serif" font-size="17" text-anchor="middle" fill="#2c3e50">élek száma: (1+2+2+2+3) : 2 = 5</text>
</svg>