<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 490" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="A nonverbális kommunikáció: amivel átadjuk, és a nem nyelvi jelek">
<title>A nonverbális kommunikáció: test, testtartás, mozdulatok, arckifejezés; mimika és gesztusok</title>
<rect width="600" height="490" rx="18" fill="#fbfaff"/>
<rect x="120" y="22" width="360" height="72" rx="16" fill="#23395d"/>
<text x="300" y="54" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">Nonverbális kommunikáció</text>
<text x="300" y="80" text-anchor="middle" font-size="16" fill="#d6eaf8">üzenet szavak nélkül</text>
<path d="M300,94 v14 H40 V388" fill="none" stroke="#23395d" stroke-width="4" stroke-linejoin="round"/>
<path d="M40,207 H68" stroke="#23395d" stroke-width="4"/><circle cx="40" cy="207" r="7" fill="#1f6fb2"/>
<path d="M40,388 H68" stroke="#23395d" stroke-width="4"/><circle cx="40" cy="388" r="7" fill="#b03a2e"/>
<rect x="70" y="130" width="510" height="154" rx="14" fill="#d6eaf8" stroke="#1f6fb2" stroke-width="3"/>
<text x="90" y="164" font-size="23" font-weight="800" fill="#1f6fb2">Amivel átadjuk</text>
<rect x="90" y="180" width="174" height="38" rx="19" fill="#fff" stroke="#1f6fb2" stroke-width="2"/>
<text x="177" y="206" font-size="18" text-anchor="middle" fill="#1c2833">test, testtartás</text>
<rect x="276" y="180" width="120" height="38" rx="19" fill="#fff" stroke="#1f6fb2" stroke-width="2"/>
<text x="336" y="206" font-size="18" text-anchor="middle" fill="#1c2833">mozdulatok</text>
<rect x="90" y="228" width="138" height="38" rx="19" fill="#fff" stroke="#1f6fb2" stroke-width="2"/>
<text x="159" y="254" font-size="18" text-anchor="middle" fill="#1c2833">arckifejezés</text>
<rect x="70" y="306" width="510" height="164" rx="14" fill="#fadbd8" stroke="#b03a2e" stroke-width="3"/>
<text x="90" y="340" font-size="23" font-weight="800" fill="#b03a2e">Nem nyelvi jelek</text>
<rect x="90" y="358" width="130" height="40" rx="20" fill="#b03a2e"/>
<text x="155" y="385" font-size="19" font-weight="700" text-anchor="middle" fill="#fff">Mimika</text>
<text x="236" y="385" font-size="18" fill="#1c2833">arcunk jelzései</text>
<rect x="90" y="420" width="130" height="40" rx="20" fill="#b03a2e"/>
<text x="155" y="447" font-size="19" font-weight="700" text-anchor="middle" fill="#fff">Gesztusok</text>
<text x="236" y="437" font-size="18" fill="#1c2833">testünk más részeivel</text>
<text x="236" y="461" font-size="18" fill="#1c2833">jelzett mozdulatok</text>
</svg>