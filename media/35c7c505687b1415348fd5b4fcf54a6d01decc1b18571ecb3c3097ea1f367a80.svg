<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Teljes gráf 5 csúccsal (A, B, C, D, E): minden csúcs össze van kötve mind a 4 másikkal, összesen 10 él">
  <rect width="640" height="400" rx="16" fill="#fdfaf3"/>
  <text x="320" y="36" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">5 ember, mindenki mindenkivel kezet fog</text>
  <g stroke="#34495e" stroke-width="3" stroke-linecap="round"><line x1="210.0" y1="80.0" x2="324.1" y2="162.9"/><line x1="210.0" y1="80.0" x2="280.5" y2="297.1"/><line x1="210.0" y1="80.0" x2="139.5" y2="297.1"/><line x1="210.0" y1="80.0" x2="95.9" y2="162.9"/><line x1="324.1" y1="162.9" x2="280.5" y2="297.1"/><line x1="324.1" y1="162.9" x2="139.5" y2="297.1"/><line x1="324.1" y1="162.9" x2="95.9" y2="162.9"/><line x1="280.5" y1="297.1" x2="139.5" y2="297.1"/><line x1="280.5" y1="297.1" x2="95.9" y2="162.9"/><line x1="139.5" y1="297.1" x2="95.9" y2="162.9"/></g>
  <g font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#fff"><circle cx="210.0" cy="80.0" r="20" fill="#8e44ad"/><text x="210.0" y="87.0">A</text><circle cx="324.1" cy="162.9" r="20" fill="#8e44ad"/><text x="324.1" y="169.9">B</text><circle cx="280.5" cy="297.1" r="20" fill="#8e44ad"/><text x="280.5" y="304.1">C</text><circle cx="139.5" cy="297.1" r="20" fill="#8e44ad"/><text x="139.5" y="304.1">D</text><circle cx="95.9" cy="162.9" r="20" fill="#8e44ad"/><text x="95.9" y="169.9">E</text></g>
  <g font-family="sans-serif" font-size="17" fill="#2c3e50">
    <text x="380" y="140">minden csúcs fokszáma: 4</text>
    <text x="380" y="170">(mindenki a másik 4-gyel)</text>
    <text x="380" y="220">élek száma:</text>
    <text x="380" y="250">5 · 4 : 2 = 10 kézfogás</text>
    <text x="380" y="300">általában n embernél:</text>
    <text x="380" y="330">n · (n - 1) : 2</text>
  </g>
</svg>