<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Hidrogén-peroxid és barnakő: a fejlődő oxigén lángra lobbantja a parázsló gyújtópálcát</title>
  <rect width="820" height="360" rx="18" fill="#f3fbf5"/>
  <text x="40" y="46" font-size="24" font-weight="800" fill="#1d5c46">Oxigén kimutatása</text>
  <text x="40" y="340" font-size="15" fill="#1d5c46">2 H2O2 → 2 H2O + O2   (a barnakő, MnO2 katalizátor)</text>
  <path d="M330,120 h50 v60 l60,110 q8,16 -10,16 h-150 q-18,0 -10,-16 l60,-110 z" fill="#ffffff" stroke="#5a6b78" stroke-width="4"/>
  <path d="M285,270 l22,-40 h96 l22,40 q8,16 -10,16 h-120 q-18,0 -10,-16 z" fill="#d6ecff"/>
  <g fill="#5b4636"><circle cx="330" cy="278" r="6"/><circle cx="350" cy="282" r="5"/><circle cx="372" cy="279" r="6"/><circle cx="392" cy="283" r="5"/></g>
  <g fill="#ffffff" stroke="#9ec9ea" stroke-width="1.5"><circle cx="340" cy="250" r="6"/><circle cx="365" cy="235" r="5"/><circle cx="352" cy="205" r="5"/><circle cx="360" cy="165" r="4"/><circle cx="350" cy="140" r="4"/></g>
  
  <line x1="355" y1="95" x2="470" y2="30" stroke="#b07a3a" stroke-width="7" stroke-linecap="round"/>
  <path d="M355,95 q-18,-12 -6,-40 q10,18 22,8 q6,20 -16,32 z" fill="#ff9f1c"/><path d="M356,90 q-8,-8 -2,-22 q6,10 10,6 q2,10 -8,16 z" fill="#fff2a8"/>
  <g font-size="15" fill="#333">
    <text x="520" y="130" font-weight="700">parázsló gyújtópálca</text><text x="520" y="150">az oxigénben újra lángra lobban</text>
    <text x="520" y="220" font-weight="700">buborékok: oxigén (O2)</text>
    <text x="520" y="280" font-weight="700" fill="#5b4636">barnakő (MnO2)</text><text x="520" y="300">nem fogy el, csak gyorsít</text>
    <text x="40" y="200" font-weight="700" fill="#2a6fa8">hidrogén-peroxid</text><text x="40" y="220">(H2O2) oldat</text>
  </g>
</svg>