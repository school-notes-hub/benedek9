<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" width="560" height="440" role="img" aria-label="Három metsző kör: T (tévé), R (rádió), Ú (újság). Csak T 24, csak T és R 21, csak R 8, mindhárom 6, csak T és Ú 14, csak R és Ú 3, csak Ú 16, kívül 8.">
  <rect width="560" height="440" rx="16" fill="#fdfaf3"/>
  <rect x="20" y="20" width="520" height="400" rx="8" fill="none" stroke="#2c3e50" stroke-width="3"/>
  <text x="40" y="52" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">U: 100 fő</text>
  <g stroke-width="3" fill-opacity="0.25">
    <circle cx="215" cy="175" r="110" fill="#e74c3c" stroke="#c0392b"/>
    <circle cx="345" cy="175" r="110" fill="#3498db" stroke="#2471a3"/>
    <circle cx="280" cy="285" r="110" fill="#27ae60" stroke="#1e8449"/>
  </g>
  <g font-family="sans-serif" font-weight="bold" text-anchor="middle">
    <text x="75" y="105" font-size="20" fill="#c0392b">T (tévé)</text>
    <text x="480" y="105" font-size="20" fill="#2471a3">R (rádió)</text>
    <text x="115" y="395" font-size="20" fill="#1e8449">Ú (újság)</text>
    <g font-size="24" fill="#2c3e50">
      <text x="170" y="165">24</text>
      <text x="280" y="140">21</text>
      <text x="390" y="165">8</text>
      <text x="280" y="222">6</text>
      <text x="215" y="265">14</text>
      <text x="345" y="265">3</text>
      <text x="280" y="340">16</text>
      <text x="470" y="360">8</text>
    </g>
  </g>
  <text x="470" y="332" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#2c3e50">egyik sem</text>
</svg>