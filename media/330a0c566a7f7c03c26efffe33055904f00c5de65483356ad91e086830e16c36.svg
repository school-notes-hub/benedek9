<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 328" width="440" height="328" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Tiszta tervgazdaság: középen az állam, tőle egy-egy vonal vezet a három alapkérdéshez: mit termeljünk (fent), hogyan termeljünk (balra lent) és kinek termeljünk (jobbra lent). Mindhárom kérdésről az állam dönt.">
  <title>Tiszta tervgazdaság: az állam dönt mindhárom alapkérdésről</title>
  <rect width="440" height="328" rx="16" fill="#fbf8f1"/>
  <text x="220" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#2f3a4a">Tiszta tervgazdaság</text>
  <text x="220" y="58" text-anchor="middle" font-size="14" fill="#55606e">Mindhárom alapkérdésről az állam dönt</text>
  <line x1="220.0" y1="157.0" x2="220.0" y2="133.0" stroke="#b8433a" stroke-width="3"/>
  <line x1="178.5" y1="211.0" x2="150.8" y2="229.0" stroke="#b8433a" stroke-width="3"/>
  <line x1="261.5" y1="211.0" x2="289.2" y2="229.0" stroke="#b8433a" stroke-width="3"/>
  <rect x="158.0" y="73.0" width="124" height="54" rx="10" fill="#ffffff" stroke="#2b6f9e" stroke-width="2.5"/>
  <text x="220" y="97.0" text-anchor="middle" font-size="18" font-weight="700" fill="#2f3a4a">Mit</text>
  <text x="220" y="117.0" text-anchor="middle" font-size="14" fill="#55606e">termeljünk?</text>
  <rect x="162.0" y="163.0" width="116" height="42" rx="10" fill="#b8433a" stroke="#b8433a" stroke-width="2.5"/>
  <text x="220" y="190.3" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">Állam</text>
  <rect x="38.0" y="235.0" width="124" height="54" rx="10" fill="#ffffff" stroke="#2b6f9e" stroke-width="2.5"/>
  <text x="100" y="259.0" text-anchor="middle" font-size="18" font-weight="700" fill="#2f3a4a">Hogyan</text>
  <text x="100" y="279.0" text-anchor="middle" font-size="14" fill="#55606e">termeljünk?</text>
  <rect x="278.0" y="235.0" width="124" height="54" rx="10" fill="#ffffff" stroke="#2b6f9e" stroke-width="2.5"/>
  <text x="340" y="259.0" text-anchor="middle" font-size="18" font-weight="700" fill="#2f3a4a">Kinek</text>
  <text x="340" y="279.0" text-anchor="middle" font-size="14" fill="#55606e">termeljünk?</text>
  <text x="220" y="310" text-anchor="middle" font-size="14" fill="#55606e">Vonal: az állam dönt az adott kérdésről</text>
</svg>