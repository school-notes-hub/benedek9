<svg xmlns="http://www.w3.org/2000/svg" width="440" height="338" viewBox="0 0 440 338" role="img"><title>Az A és B halmaz két metsző körének teljes belseje satírozott, a közös résszel együtt.</title><rect x="0" y="0" width="440" height="338" rx="12" fill="#fff" stroke="none" stroke-width="3"/><defs><pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M-2,2 L2,-2 M0,9 L9,0 M7,11 L11,7" stroke="#08717d" stroke-width="1.4"/></pattern></defs><text x="220" y="40" font-family="DejaVu Sans, sans-serif" font-size="30" fill="#15354d" text-anchor="middle">Unió</text><circle cx="160" cy="165" r="97" fill="#dff3f3" stroke="none" stroke-width="0"/><circle cx="280" cy="165" r="97" fill="#dff3f3" stroke="none" stroke-width="0"/><circle cx="160" cy="165" r="97" fill="url(#hatch)" stroke="none" stroke-width="0"/><circle cx="280" cy="165" r="97" fill="url(#hatch)" stroke="none" stroke-width="0"/><circle cx="160" cy="165" r="97" fill="none" stroke="#15354d" stroke-width="3"/><circle cx="280" cy="165" r="97" fill="none" stroke="#15354d" stroke-width="3"/><text x="76" y="81" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#15354d" text-anchor="middle">A</text><text x="364" y="81" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#15354d" text-anchor="middle">B</text><text x="220" y="305" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#15354d" text-anchor="middle">A közös rész is beletartozik.</text></svg>