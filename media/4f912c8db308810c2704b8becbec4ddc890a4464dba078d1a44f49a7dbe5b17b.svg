<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 830" role="img" aria-labelledby="title desc" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="title">A kommunikáció modellje - saját tanulóábra</title>
  <desc id="desc">Az információ az adóhoz érkezik. Az adó üzenete kóddal, csatornán át jut a vevőhöz, akinél információ jelenik meg. Szaggatott nyíl is vezet vissza a vevőtől az adó felé; a visszacsatolás ettől külön, feliratozott út. További tényezők a kontextus, a közös tudás, az előismeretek és a kapcsolat.</desc>
  <defs>
    <marker id="forward" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#315d89"/></marker>
    <marker id="back" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a84333"/></marker>
  </defs>
  <rect width="560" height="830" rx="20" fill="#f4f8ff"/>
  <text x="280" y="42" text-anchor="middle" font-size="25" font-weight="700" fill="#23395d">A kommunikáció modellje</text>
  <text x="280" y="72" text-anchor="middle" font-size="17" fill="#465568">Saját ábra a tankönyvi tényezőkhöz</text>
  <g text-anchor="middle" fill="#23395d">
    <text x="280" y="115" font-size="20">Információ</text>
    <rect x="180" y="160" width="200" height="65" rx="16" fill="#d8eaff" stroke="#315d89" stroke-width="2"/>
    <text x="280" y="201" font-size="27" font-weight="700">Adó</text>
    <text x="280" y="271" font-size="19">Üzenet</text>
    <rect x="190" y="300" width="180" height="57" rx="12" fill="#fff1cc" stroke="#b78a36" stroke-width="2"/>
    <text x="280" y="337" font-size="23" font-weight="700">Kód</text>
    <rect x="190" y="373" width="180" height="57" rx="12" fill="#fff1cc" stroke="#b78a36" stroke-width="2"/>
    <text x="280" y="410" font-size="23" font-weight="700">Csatorna</text>
    <rect x="180" y="474" width="200" height="65" rx="16" fill="#d6f1e9" stroke="#258570" stroke-width="2"/>
    <text x="280" y="515" font-size="27" font-weight="700">Vevő</text>
    <text x="280" y="598" font-size="20">Információ</text>
  </g>
  <g stroke="#315d89" stroke-width="3" fill="none" marker-end="url(#forward)">
    <path d="M280 124V154"/>
    <path d="M280 225V243"/>
    <path d="M280 278V293"/>
    <path d="M280 435V468"/>
    <path d="M280 539V571"/>
  </g>
  <path d="M180 508H100V192H173" fill="none" stroke="#315d89" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#forward)"/>
  <path d="M380 507H445V193H387" fill="none" stroke="#a84333" stroke-width="3" marker-end="url(#back)"/>
  <text x="477" y="352" transform="rotate(-90 477 352)" text-anchor="middle" font-size="21" font-weight="700" fill="#a84333">Visszacsatolás</text>
  <rect x="35" y="633" width="490" height="169" rx="15" fill="#e8edf5"/>
  <g fill="#23395d" font-size="22" text-anchor="middle">
    <text x="280" y="669">Kontextus</text>
    <text x="280" y="706">Közös tudás</text>
    <text x="280" y="743">Előismeretek</text>
    <text x="280" y="780">Kapcsolat</text>
  </g>
</svg>