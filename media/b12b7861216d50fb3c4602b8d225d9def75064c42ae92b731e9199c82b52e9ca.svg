<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-label="Fa-diagram: 3 póló (piros, kék, zöld), mindegyikből 2 ág indul a 2 nadrághoz (farmer, bézs); összesen 6 ágvég, vagyis 3 · 2 = 6 összeállítás">
  <rect width="640" height="380" rx="16" fill="#fdfaf3"/>
  <text x="320" y="48" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">Mit vegyek fel?</text>
  <g stroke="#7f8c8d" stroke-width="2.5"><line x1="320" y1="62" x2="120" y2="100"/><line x1="120" y1="185" x2="70" y2="226"/><line x1="120" y1="185" x2="170" y2="226"/><line x1="320" y1="62" x2="320" y2="100"/><line x1="320" y1="185" x2="270" y2="226"/><line x1="320" y1="185" x2="370" y2="226"/><line x1="320" y1="62" x2="520" y2="100"/><line x1="520" y1="185" x2="470" y2="226"/><line x1="520" y1="185" x2="570" y2="226"/></g>
  <g font-family="sans-serif" font-size="15" text-anchor="middle" fill="#2c3e50"><polygon points="90,110 108,104 132,104 150,110 156,126 142,130 142,156 98,156 98,130 84,126" fill="#e74c3c" stroke="#2c3e50" stroke-width="2"/><text x="120" y="178">piros póló</text><polygon points="52,231 88,231 90,281 75,281 70,251 65,281 50,281" fill="#34495e" stroke="#2c3e50" stroke-width="2"/><text x="70" y="300">farmer</text><polygon points="152,231 188,231 190,281 175,281 170,251 165,281 150,281" fill="#d4ac6e" stroke="#2c3e50" stroke-width="2"/><text x="170" y="300">bézs</text><polygon points="290,110 308,104 332,104 350,110 356,126 342,130 342,156 298,156 298,130 284,126" fill="#3498db" stroke="#2c3e50" stroke-width="2"/><text x="320" y="178">kék póló</text><polygon points="252,231 288,231 290,281 275,281 270,251 265,281 250,281" fill="#34495e" stroke="#2c3e50" stroke-width="2"/><text x="270" y="300">farmer</text><polygon points="352,231 388,231 390,281 375,281 370,251 365,281 350,281" fill="#d4ac6e" stroke="#2c3e50" stroke-width="2"/><text x="370" y="300">bézs</text><polygon points="490,110 508,104 532,104 550,110 556,126 542,130 542,156 498,156 498,130 484,126" fill="#27ae60" stroke="#2c3e50" stroke-width="2"/><text x="520" y="178">zöld póló</text><polygon points="452,231 488,231 490,281 475,281 470,251 465,281 450,281" fill="#34495e" stroke="#2c3e50" stroke-width="2"/><text x="470" y="300">farmer</text><polygon points="552,231 588,231 590,281 575,281 570,251 565,281 550,281" fill="#d4ac6e" stroke="#2c3e50" stroke-width="2"/><text x="570" y="300">bézs</text></g>
  <text x="320" y="350" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">3 póló · 2 nadrág = 6 összeállítás</text>
</svg>