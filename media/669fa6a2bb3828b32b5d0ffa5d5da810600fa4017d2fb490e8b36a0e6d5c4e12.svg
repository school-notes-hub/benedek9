<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 410" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Háromszintű rajz: fent a szellemvilág, középen a dobos sámán, lent a közösség; nyilak mutatják, hogy a sámán közvetít közöttük</title>
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect width="820" height="410" rx="18" fill="#faf8ff"/>
<text x="410" y="40" text-anchor="middle" font-size="24" font-weight="800" fill="#3b2a55">A sámán: közvetítő két világ között</text>
<rect x="60" y="62" width="700" height="80" rx="40" fill="#d9ccf2"/><text x="410" y="96" text-anchor="middle" font-size="18" font-weight="800" fill="#3b2a55">Szellemvilág</text><text x="410" y="120" text-anchor="middle" font-size="14" fill="#3b2a55">animizmus: szellemek népesítik be a világot</text>

<g transform="translate(410,210)"><circle cy="-22" r="16" fill="#e8b27a"/><path d="M-10,-40 l10,-14 l10,14" fill="#c0392b"/><path d="M-26,0 q26,-12 52,0 v44 h-52 z" fill="#8b5a2b"/><ellipse cx="44" cy="14" rx="20" ry="24" fill="#f3e0c0" stroke="#8b5a2b" stroke-width="3"/><text x="0" y="72" text-anchor="middle" font-size="17" font-weight="800" fill="#3b2a55">Sámán</text></g>
<g stroke="#555" stroke-width="3"><line x1="380" y1="182" x2="380" y2="150" marker-end="url(#a)"/><line x1="440" y1="150" x2="440" y2="182" marker-end="url(#a)"/><line x1="380" y1="290" x2="380" y2="318" marker-end="url(#a)"/><line x1="440" y1="318" x2="440" y2="290" marker-end="url(#a)"/></g>
<rect x="60" y="322" width="700" height="70" rx="20" fill="#e6d7c3"/><g transform="translate(150,350)"><circle cy="-6" r="9" fill="#e8b27a"/><rect x="-9" y="5" width="18" height="22" rx="6" fill="#7a5a3a"/></g><g transform="translate(200,350)"><circle cy="-6" r="9" fill="#e8b27a"/><rect x="-9" y="5" width="18" height="22" rx="6" fill="#7a5a3a"/></g><g transform="translate(250,350)"><circle cy="-6" r="9" fill="#e8b27a"/><rect x="-9" y="5" width="18" height="22" rx="6" fill="#7a5a3a"/></g><g transform="translate(570,350)"><circle cy="-6" r="9" fill="#e8b27a"/><rect x="-9" y="5" width="18" height="22" rx="6" fill="#7a5a3a"/></g><g transform="translate(620,350)"><circle cy="-6" r="9" fill="#e8b27a"/><rect x="-9" y="5" width="18" height="22" rx="6" fill="#7a5a3a"/></g><g transform="translate(670,350)"><circle cy="-6" r="9" fill="#e8b27a"/><rect x="-9" y="5" width="18" height="22" rx="6" fill="#7a5a3a"/></g><text x="410" y="364" text-anchor="middle" font-size="18" font-weight="800" fill="#5a3a1a">Közösség</text>
</svg>