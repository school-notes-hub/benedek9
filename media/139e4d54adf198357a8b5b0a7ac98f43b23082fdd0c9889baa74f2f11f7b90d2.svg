<svg xmlns="http://www.w3.org/2000/svg" width="600" height="997" viewBox="0 0 600 997" role="img" aria-labelledby="title desc">
<title id="title">Kleiszthenész phüléi</title>
<desc id="desc">Vázlat, nem térkép. Fent Attika három része egymás mellett: város, tengerpart, belső vidék; mindegyik 10 kis négyzetre, egységre osztva. Mindhárom rész egy-egy kiemelt egységéből egy vonal vezet le egy dobozba: egy phülé egy városi, egy tengerparti és egy belső egységből áll, nem összefüggő terület. Alatta tíz kis háromrészes jel: így lett 10 phülé. Nyíl lefelé, felirata: minden phülé ad. Két doboz: Ötszázak tanácsa (bulé), phülénként 50 tag sorsolással, 10 × 50 = 500 fő; Sztratégoszok (hadvezérek), phülénként 1, választással, 10 fő, újraválaszthatók.</desc>
