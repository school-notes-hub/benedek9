<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 628" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Maslow-piramis: a szükségletek öt szintje, szintenként példákkal</title>
  <rect width="640" height="628" rx="18" fill="#fffaf0"/>
  <text x="320" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#3b2f2f">Maslow-piramis</text>
  <text x="320" y="66" text-anchor="middle" font-size="15" fill="#6b5b53">Öt szükségletszint; egyszerre több is fontos lehet.</text>
  
  <polygon points="320,86 419.6,250 220.4,250" fill="#7b4bb7"/>
  <polygon points="220.4,250 419.6,250 469.7,332.5 170.3,332.5" fill="#2f6fc4"/>
  <polygon points="170.3,332.5 469.7,332.5 519.8,415 120.2,415" fill="#1f8a7e"/>
  <polygon points="120.2,415 519.8,415 569.9,497.5 70.1,497.5" fill="#b8730e"/>
  <polygon points="70.1,497.5 569.9,497.5 620,580 20,580" fill="#c4473a"/>
  <g fill="#ffffff" text-anchor="middle">
    <g font-size="15">
      <text x="320" y="170">vitalitás,</text>
      <text x="320" y="190">kreativitás,</text>
      <text x="320" y="210">céltudatosság</text>
    </g>
    <text x="320" y="238" font-size="16" font-weight="700">5. Önmegvalósítás</text>
    <text x="320" y="276" font-size="16" font-weight="700">4. Önbecsülés</text>
    <text x="320" y="298" font-size="15">presztízs, pozíció,</text>
    <text x="320" y="318" font-size="15">elismerés, önbecsülés</text>
    <text x="320" y="364" font-size="16" font-weight="700">3. Szociális szükségletek</text>
    <text x="320" y="388" font-size="15">barátság, család, szeretet</text>
    <text x="320" y="446" font-size="16" font-weight="700">2. Biztonság</text>
    <text x="320" y="470" font-size="15">fizikai, anyagi, erkölcsi, vagyoni</text>
    <text x="320" y="529" font-size="16" font-weight="700">1. Fiziológiai szükségletek</text>
    <text x="320" y="553" font-size="15">légzés, étel, víz, alvás</text>
  </g>
  <text x="320" y="610" text-anchor="middle" font-size="13" fill="#8a7d74">A szintek szélessége nem mért adat; a sorrend nem merev lépcsősor.</text>
</svg>