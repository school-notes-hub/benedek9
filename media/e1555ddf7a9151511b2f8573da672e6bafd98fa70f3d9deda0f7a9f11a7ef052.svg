<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Nátrium a fenolftaleines vízben: a nátriumgolyó cikázik, hidrogén fejlődik, a víz rózsaszín lesz</title>
  <rect width="820" height="360" rx="18" fill="#fff7fb"/>
  <text x="40" y="46" font-size="24" font-weight="800" fill="#7a1f4f">Nátrium + víz</text>
  <text x="40" y="74" font-size="15" fill="#7a1f4f">2 Na + 2 H2O → 2 NaOH + H2</text>
  
  <path d="M250,110 v200 q0,20 20,20 h280 q20,0 20,-20 v-200" fill="none" stroke="#5a6b78" stroke-width="4"/>
  <path d="M254,170 h312 v140 q0,16 -16,16 h-280 q-16,0 -16,-16 z" fill="#ff8fc7" opacity="0.75"/>
  <path d="M254,170 q40,-8 80,0 t80,0 t80,0 t72,0" fill="none" stroke="#e05aa0" stroke-width="3"/>
  
  <path d="M330,172 q30,-14 60,0 q30,14 60,-2" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="4 6"/>
  <circle cx="455" cy="165" r="14" fill="#d9d9d9" stroke="#888" stroke-width="2"/>
  <path d="M455,150 q-10,-22 4,-40 q10,20 -4,40 z" fill="#ffb347"/><path d="M455,146 q-4,-12 2,-24 q5,12 -2,24 z" fill="#fff2a8"/>
  <g fill="#ffffff" opacity="0.9"><circle cx="440" cy="140" r="4"/><circle cx="470" cy="132" r="3"/><circle cx="430" cy="118" r="3"/></g>
  <text x="600" y="100" font-size="14" fill="#7a1f4f">H2 gáz: meg is gyulladhat</text><line x1="595" y1="98" x2="468" y2="128" stroke="#888" stroke-width="1.5"/>
  
  <g font-size="15" fill="#333">
    <text x="600" y="170" font-weight="700">nátriumgolyó</text><text x="600" y="190">úszik, cikázik,</text><text x="600" y="210">egyre kisebb lesz</text>
    <line x1="595" y1="170" x2="472" y2="166" stroke="#888" stroke-width="1.5"/>
    <text x="600" y="270" font-weight="700" fill="#c2186b">rózsaszín víz</text><text x="600" y="290">fenolftalein + lúg (NaOH)</text>
    <line x1="595" y1="270" x2="560" y2="260" stroke="#888" stroke-width="1.5"/>
    <text x="40" y="250" font-weight="700">előtte:</text><text x="40" y="270">víz + fenolftalein</text><text x="40" y="290">= színtelen</text>
  </g>
</svg>