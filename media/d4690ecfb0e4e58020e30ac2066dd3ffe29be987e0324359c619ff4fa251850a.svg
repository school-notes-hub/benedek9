<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>400 000 Ft bruttó bér felbontása három esetben: 25 éves vagy idősebb és 25 év alatti munkavállaló munkaviszonyban, valamint 25 év alatti diák iskolaszövetkezetben</title>
<rect width="640" height="560" rx="18" fill="#f7f9fc"/>
<text x="320" y="40" text-anchor="middle" font-size="24" font-weight="800" fill="#23395d">Hová megy a 400 000 Ft bruttó bér?</text>

<line x1="40" y1="90" x2="600" y2="90" stroke="#999" stroke-dasharray="6 5"/><text x="600" y="80" text-anchor="end" font-size="14" fill="#555">400 000 Ft bruttó</text>
<g font-size="16" font-weight="700" fill="#fff" text-anchor="middle">
<rect x="60" y="90" width="140" height="55.5" fill="#d08a10"/><text x="130" y="123.5">TB 74 000</text>
<rect x="60" y="145.5" width="140" height="45" fill="#e25c4b"/><text x="130" y="173.8">SZJA 60 000</text>
<rect x="60" y="190.5" width="140" height="199.5" fill="#1f8a7e"/><text x="130" y="296">nettó 266 000</text>
<rect x="250" y="90" width="140" height="55.5" fill="#d08a10"/><text x="320" y="123.5">TB 74 000</text>
<rect x="250" y="145.5" width="140" height="244.5" fill="#1f8a7e"/><text x="320" y="273.5">nettó 326 000</text>
<rect x="440" y="90" width="140" height="300" fill="#1f8a7e"/><text x="510" y="230">nettó 400 000</text>
<text x="510" y="256" font-size="13" font-weight="400">nincs TB-járulék,</text><text x="510" y="274" font-size="13" font-weight="400">nincs SZJA</text>
</g>
<g font-size="14" fill="#23395d" text-anchor="middle">
<text x="130" y="414" font-weight="800">25 éves vagy idősebb</text><text x="130" y="433">munkaviszonyban</text>
<text x="320" y="414" font-weight="800">25 év alatti</text><text x="320" y="433">munkaviszonyban</text>
<text x="510" y="414" font-weight="800">25 év alatti diák</text><text x="510" y="433">iskolaszövetkezetben</text><text x="510" y="452">(nappali tagozat)</text>
</g>
<g font-size="14" fill="#333">
<rect x="60" y="480" width="16" height="16" fill="#1f8a7e"/><text x="84" y="493">nettó (kézhez)</text>
<rect x="250" y="480" width="16" height="16" fill="#e25c4b"/><text x="274" y="493">SZJA 15%</text>
<rect x="400" y="480" width="16" height="16" fill="#d08a10"/><text x="424" y="493">TB-járulék 18,5%</text>
</g>
<text x="320" y="534" text-anchor="middle" font-size="13" fill="#555">2026-os kulcsok; 25 év alatt teljes SZJA-kedvezmény; más kedvezmény és levonás nélkül</text>
</svg>