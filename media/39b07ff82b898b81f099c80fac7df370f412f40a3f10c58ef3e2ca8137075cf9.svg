<svg xmlns="http://www.w3.org/2000/svg" width="600" height="782" viewBox="0 0 600 782" role="img" aria-labelledby="title desc">
<title id="title">Mit cseréltek a gyarmatvárosok?</title>
<desc id="desc">Három egymás alatti doboz: anyaváros (metropolisz), gyarmatváros (önálló görög polisz), barbárok (a környék nem görög népei). Minden két doboz között bal oldalon lefelé mutató nyíl: olívaolaj, bor, kerámia, fémáru, szövet; jobb oldalon felfelé mutató nyíl: fémek, gabona, rabszolga. Az anyaváros és a gyarmatváros között a tengeren, a gyarmatváros és a barbárok között szárazföldön folyt a csere.</desc>
<defs><marker id="a-2f7d6d" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2f7d6d"/></marker><marker id="a-b5652b" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b5652b"/></marker></defs>
<rect width="600" height="782" fill="#fffdf7"/>
<g font-family="DejaVu Sans, Verdana, sans-serif">
<text x="20" y="44" font-size="30" font-weight="bold" font-style="normal" text-anchor="start" fill="#1f3440">Mit cseréltek a gyarmatvárosok?</text><text x="20" y="82" font-size="20" font-weight="normal" font-style="normal" text-anchor="start" fill="#1f3440">Görög gyarmatosítás · Kr. e. 8–7. század</text><rect x="145" y="112" width="310" height="64" rx="14" fill="#e7ead2" stroke="#6f7a2c" stroke-width="3"/><text x="300.0" y="142" font-size="22" font-weight="bold" font-style="normal" text-anchor="middle" fill="#1f3440">anyaváros</text><text x="300.0" y="166" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#1f3440">(metropolisz)</text><path d="M215 184 V358" stroke="#2f7d6d" stroke-width="7" marker-end="url(#a-2f7d6d)"/><path d="M385 358 V184" stroke="#2f7d6d" stroke-width="7" marker-end="url(#a-2f7d6d)"/><text x="199" y="237.0" font-size="20" font-weight="normal" font-style="normal" text-anchor="end" fill="#1f3440">olívaolaj, bor,</text><text x="199" y="263.0" font-size="20" font-weight="normal" font-style="normal" text-anchor="end" fill="#1f3440">kerámia,</text><text x="199" y="289.0" font-size="20" font-weight="normal" font-style="normal" text-anchor="end" fill="#1f3440">fémáru,</text><text x="199" y="315.0" font-size="20" font-weight="normal" font-style="normal" text-anchor="end" fill="#1f3440">szövet</text><text x="401" y="250.0" font-size="20" font-weight="normal" font-style="normal" text-anchor="start" fill="#1f3440">fémek,</text><text x="401" y="276.0" font-size="20" font-weight="normal" font-style="normal" text-anchor="start" fill="#1f3440">gabona,</text><text x="401" y="302.0" font-size="20" font-weight="normal" font-style="normal" text-anchor="start" fill="#1f3440">rabszolga</text><text x="300.0" y="278.0" font-size="19" font-weight="normal" font-style="italic" text-anchor="middle" fill="#2f7d6d">a tengeren</text><rect x="145" y="366" width="310" height="64" rx="14" fill="#e7ead2" stroke="#6f7a2c" stroke-width="3"/><text x="300.0" y="396" font-size="22" font-weight="bold" font-style="normal" text-anchor="middle" fill="#1f3440">gyarmatváros</text><text x="300.0" y="420" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#1f3440">önálló görög polisz</text><path d="M215 438 V612" stroke="#b5652b" stroke-width="7" marker-end="url(#a-b5652b)"/><path d="M385 612 V438" stroke="#b5652b" stroke-width="7" marker-end="url(#a-b5652b)"/><text x="199" y="491.0" font-size="20" font-weight="normal" font-style="normal" text-anchor="end" fill="#1f3440">olívaolaj, bor,</text><text x="199" y="517.0" font-size="20" font-weight="normal" font-style="normal" text-anchor="end" fill="#1f3440">kerámia,</text><text x="199" y="543.0" font-size="20" font-weight="normal" font-style="normal" text-anchor="end" fill="#1f3440">fémáru,</text><text x="199" y="569.0" font-size="20" font-weight="normal" font-style="normal" text-anchor="end" fill="#1f3440">szövet</text><text x="401" y="504.0" font-size="20" font-weight="normal" font-style="normal" text-anchor="start" fill="#1f3440">fémek,</text><text x="401" y="530.0" font-size="20" font-weight="normal" font-style="normal" text-anchor="start" fill="#1f3440">gabona,</text><text x="401" y="556.0" font-size="20" font-weight="normal" font-style="normal" text-anchor="start" fill="#1f3440">rabszolga</text><text x="300.0" y="532.0" font-size="19" font-weight="normal" font-style="italic" text-anchor="middle" fill="#b5652b">szárazföldön</text><rect x="145" y="620" width="310" height="64" rx="14" fill="#e7ead2" stroke="#6f7a2c" stroke-width="3"/><text x="300.0" y="650" font-size="22" font-weight="bold" font-style="normal" text-anchor="middle" fill="#1f3440">barbárok</text><text x="300.0" y="674" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#1f3440">a környék nem görög népei</text><text x="20" y="730" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#1f3440">Lefelé: görög termékek.</text><text x="20" y="758" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#1f3440">Felfelé: nyersanyag, élelem és rabszolga.</text>
</g>
