<svg xmlns="http://www.w3.org/2000/svg" width="440" height="235" viewBox="0 0 440 235" role="img"><title>A betű négyzetben, A körben, B körben, B négyzetben: a formák megkülönböztetik az azonos betűjű kártyákat.</title><rect x="0" y="0" width="440" height="235" rx="12" fill="#fff" stroke="none" stroke-width="3"/><text x="220" y="40" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#15354d" text-anchor="middle">Négy különböző kártya</text><rect x="20" y="75" width="80" height="80" rx="0" fill="#e9f5f5" stroke="#15354d" stroke-width="3"/><text x="60" y="130" font-family="DejaVu Sans, sans-serif" font-size="43" fill="#15354d" text-anchor="middle">A</text><circle cx="167" cy="115" r="40" fill="#fff2d5" stroke="#15354d" stroke-width="3"/><text x="167" y="130" font-family="DejaVu Sans, sans-serif" font-size="43" fill="#15354d" text-anchor="middle">A</text><circle cx="274" cy="115" r="40" fill="#fff2d5" stroke="#15354d" stroke-width="3"/><text x="274" y="130" font-family="DejaVu Sans, sans-serif" font-size="43" fill="#15354d" text-anchor="middle">B</text><rect x="341" y="75" width="80" height="80" rx="0" fill="#e9f5f5" stroke="#15354d" stroke-width="3"/><text x="381" y="130" font-family="DejaVu Sans, sans-serif" font-size="43" fill="#15354d" text-anchor="middle">B</text><text x="220" y="205" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#15354d" text-anchor="middle">Csak a betűket nézve: két A, két B.</text></svg>