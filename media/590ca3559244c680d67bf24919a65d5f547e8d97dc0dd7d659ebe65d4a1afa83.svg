<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>A három műnem: epika (könyv), líra (szív), dráma (színházi maszkok)</title>
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect width="820" height="340" rx="18" fill="#fffaf0"/>
<text x="410" y="44" text-anchor="middle" font-size="24" font-weight="800" fill="#3b2f2f">A három műnem</text>
<g transform="translate(140,0)"><rect x="-120" y="70" width="240" height="250" rx="16" fill="#3f7fd6"/><path d="M-60,110 q30,-12 58,0 v90 q-28,-12 -58,0 z" fill="#fff"/><path d="M60,110 q-30,-12 -58,0 v90 q28,-12 58,0 z" fill="#f2f2f2"/><g stroke="#bbb" stroke-width="3"><line x1="-50" y1="130" x2="-12" y2="130"/><line x1="-50" y1="146" x2="-12" y2="146"/><line x1="12" y1="130" x2="50" y2="130"/><line x1="12" y1="146" x2="50" y2="146"/></g><text x="0" y="250" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">Epika</text><text x="0" y="278" text-anchor="middle" font-size="14" fill="#fff">történetet beszél el,</text><text x="0" y="298" text-anchor="middle" font-size="14" fill="#fff">narrátorral</text></g>
<g transform="translate(410,0)"><rect x="-120" y="70" width="240" height="250" rx="16" fill="#e25c4b"/><path d="M0,210 C-70,160 -50,100 -20,105 C-8,107 0,118 0,126 C0,118 8,107 20,105 C50,100 70,160 0,210 z" fill="#fff"/><text x="0" y="250" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">Líra</text><text x="0" y="278" text-anchor="middle" font-size="14" fill="#fff">érzelmek, hangulatok,</text><text x="0" y="298" text-anchor="middle" font-size="14" fill="#fff">gondolatok</text></g>
<g transform="translate(680,0)"><rect x="-120" y="70" width="240" height="250" rx="16" fill="#8e5cc7"/><g transform="translate(-30,150) rotate(-12)"><path d="M-30,-40 h60 v40 q0,40 -30,40 q-30,0 -30,-40 z" fill="#fff"/><circle cx="-12" cy="-12" r="6" fill="#8e5cc7"/><circle cx="12" cy="-12" r="6" fill="#8e5cc7"/><path d="M-14,14 q14,14 28,0" stroke="#8e5cc7" stroke-width="4" fill="none"/></g><g transform="translate(34,160) rotate(12)"><path d="M-30,-40 h60 v40 q0,40 -30,40 q-30,0 -30,-40 z" fill="#f2e8ff"/><circle cx="-12" cy="-12" r="6" fill="#8e5cc7"/><circle cx="12" cy="-12" r="6" fill="#8e5cc7"/><path d="M-14,22 q14,-14 28,0" stroke="#8e5cc7" stroke-width="4" fill="none"/></g><text x="0" y="250" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">Dráma</text><text x="0" y="278" text-anchor="middle" font-size="14" fill="#fff">párbeszéd,</text><text x="0" y="298" text-anchor="middle" font-size="14" fill="#fff">színpadra szánt mű</text></g>
</svg>