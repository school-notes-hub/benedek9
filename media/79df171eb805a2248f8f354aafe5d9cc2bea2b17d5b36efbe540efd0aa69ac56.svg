<svg xmlns="http://www.w3.org/2000/svg" width="600" height="922" viewBox="0 0 600 922" role="img" aria-labelledby="title desc">
<title id="title">Hogyan született döntés Athénban?</title>
<desc id="desc">Négy egymás alatti doboz, közöttük lefelé mutató nyilak. 1. Indítvány: bármely polgár javasolhat, új törvényt vagy régi eltörlését. Nyíl: az indítvány a tanácshoz kerül. 2. Ötszázak tanácsa (bulé): 500 tag, sorsolással, egy évre; előkészíti az indítványt, és állást foglal róla. Nyíl: csak előkészítve mehet tovább. 3. Népgyűlés, a legfőbb szerv: tagja minden 20. évét betöltött athéni polgár; vita, majd szavazás kézfelemeléssel vagy kaviccsal az urnába. Nyíl: a népgyűlés dönt. 4. Döntés, például háborúról és békéről, törvényről, közellátásról.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4a5864"/></marker></defs>
<rect width="600" height="922" fill="#fffdf7"/>
<g font-family="DejaVu Sans, Verdana, sans-serif" fill="#1f3440">
<text x="20" y="46" font-size="30" font-weight="bold">Hogyan született döntés?</text>
<text x="20" y="82" font-size="20">Athéni demokrácia · Kr. e. 5. század</text>
<rect x="60" y="110" width="480" height="110" rx="14" fill="#f1ead8" stroke="#8a6d2f" stroke-width="3"/>
