<svg xmlns="http://www.w3.org/2000/svg" width="600" height="806" viewBox="0 0 600 806" role="img" aria-labelledby="title desc">
<title id="title">Egyiptom és a Nílus</title>
<desc id="desc">Tájékozódási térkép mai partvonallal. A Nílus délről a Földközi-tengerig, a deltában két fő ággal; körülötte zöld sáv a termőföld, északon a zöld delta. Alsó-Egyiptom a delta, Felső-Egyiptom a déli keskeny völgy. Gíza a delta csúcsánál. Kétoldalt sivatag, keleten a Vörös-tenger.</desc>
