<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>A sámán közvetít a szellemvilág és a közösség között</title>
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect width="400" height="440" rx="16" fill="#faf8ff"/>
<text x="200" y="36" text-anchor="middle" font-size="21" font-weight="800" fill="#3b2a55">A sámán két világ között</text>
<rect x="20" y="56" width="360" height="74" rx="37" fill="#d9ccf2"/>
<text x="200" y="88" text-anchor="middle" font-size="19" font-weight="800" fill="#3b2a55">Szellemvilág</text>
<text x="200" y="112" text-anchor="middle" font-size="15" fill="#3b2a55">szellemek, lelkek világa</text>
<g transform="translate(200,222)"><circle cy="-22" r="16" fill="#e8b27a"/><path d="M-10,-40 l10,-14 l10,14" fill="#c0392b"/><path d="M-26,0 q26,-12 52,0 v44 h-52 z" fill="#8b5a2b"/><ellipse cx="44" cy="14" rx="20" ry="24" fill="#f3e0c0" stroke="#8b5a2b" stroke-width="3"/><text x="0" y="72" text-anchor="middle" font-size="18" font-weight="800" fill="#3b2a55">Sámán</text></g>
<g stroke="#555" stroke-width="3"><line x1="160" y1="182" x2="160" y2="140" marker-end="url(#a)"/><line x1="240" y1="140" x2="240" y2="182" marker-end="url(#a)"/><line x1="160" y1="312" x2="160" y2="352" marker-end="url(#a)"/><line x1="240" y1="352" x2="240" y2="312" marker-end="url(#a)"/></g>
<rect x="20" y="360" width="360" height="66" rx="20" fill="#e6d7c3"/><g transform="translate(70,392)"><circle cy="-8" r="9" fill="#e8b27a"/><rect x="-9" y="3" width="18" height="22" rx="6" fill="#7a5a3a"/></g><g transform="translate(110,392)"><circle cy="-8" r="9" fill="#e8b27a"/><rect x="-9" y="3" width="18" height="22" rx="6" fill="#7a5a3a"/></g><g transform="translate(290,392)"><circle cy="-8" r="9" fill="#e8b27a"/><rect x="-9" y="3" width="18" height="22" rx="6" fill="#7a5a3a"/></g><g transform="translate(330,392)"><circle cy="-8" r="9" fill="#e8b27a"/><rect x="-9" y="3" width="18" height="22" rx="6" fill="#7a5a3a"/></g>
<text x="200" y="400" text-anchor="middle" font-size="19" font-weight="800" fill="#5a3a1a">Közösség</text>
</svg>