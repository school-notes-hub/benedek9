<svg xmlns="http://www.w3.org/2000/svg" width="400" height="342" viewBox="0 0 400 342" role="img" aria-label="A számhalmazok halmazábrája. Egy téglalap a valós számok (ℝ) halmaza. Függőleges vonal osztja két részre: a bal, nagyobb rész a racionális számok (ℚ), benne a 2/3 és a 0,3; a jobb sáv az irracionális számok (ℚ*), benne a √2 és a π. A ℚ részen belül egy nagy ellipszis az egész számok (ℤ), benne a −1 és a −2; azon belül egy kisebb ellipszis a természetes számok (ℕ), benne 0; 1; 2; 3; …">
<title>A számhalmazok halmazábrája. Egy téglalap a valós számok (ℝ) halmaza. Függőleges vonal osztja két részre: a bal, nagyobb rész a racionális számok (ℚ), benne a 2/3 és a 0,3; a jobb sáv az irracionális számok (ℚ*), benne a √2 és a π. A ℚ részen belül egy nagy ellipszis az egész számok (ℤ), benne a −1 és a −2; azon belül egy kisebb ellipszis a természetes számok (ℕ), benne 0; 1; 2; 3; …</title>
<rect width="400" height="342" fill="#ffffff"/>
<rect x="10" y="10" width="170" height="32" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="20" y="32" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#1a1a1a">ℝ valós számok</text>
<rect x="10" y="42" width="380" height="290" fill="#fff7d6" stroke="#1a1a1a" stroke-width="2"/>
<rect x="290" y="42" width="100" height="290" fill="#fbe3ef" stroke="#1a1a1a" stroke-width="2"/>
<text x="20" y="64" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#1a1a1a">ℚ racionális</text>
<text x="300" y="66" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#1a1a1a">ℚ*</text>
<text x="300" y="84" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#1a1a1a">irracionális</text>
<text x="330" y="175" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#1a1a1a">√2</text>
<text x="330" y="235" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#1a1a1a">π</text>
<ellipse cx="150" cy="195" rx="122" ry="112" fill="#dff3e4" stroke="#1a1a1a" stroke-width="2"/>
<text x="150" y="112" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">ℤ egész</text>
<ellipse cx="165" cy="218" rx="72" ry="62" fill="#dceefe" stroke="#1a1a1a" stroke-width="2"/>
<text x="165" y="192" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">ℕ természetes</text>
<text x="165" y="228" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1a1a1a">0; 1; 2; 3; …</text>
<text x="58" y="205" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1a1a1a">−1</text>
<text x="62" y="242" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1a1a1a">−2</text>
<text x="70" y="272" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1a1a1a">…</text>
<text x="36" y="318" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1a1a1a">2/3</text>
<text x="256" y="106" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1a1a1a">0,3</text>
</svg>