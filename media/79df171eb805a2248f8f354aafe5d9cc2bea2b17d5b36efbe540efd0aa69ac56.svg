<text x="190" y="265.0" font-size="19" font-style="italic">az indítvány a tanácshoz kerül</text>
<rect x="60" y="298" width="480" height="136" rx="14" fill="#dfe9f3" stroke="#2c5d8a" stroke-width="3"/>
<text x="300.0" y="332" font-size="22" font-weight="bold" text-anchor="middle" fill="#2c5d8a">Ötszázak tanácsa (bulé)</text>
<text x="300.0" y="362" font-size="20" text-anchor="middle">500 tag, sorsolással, egy évre</text>
<text x="300.0" y="388" font-size="20" text-anchor="middle">előkészíti az indítványt,</text>
<text x="300.0" y="414" font-size="20" text-anchor="middle">és állást foglal róla</text>
<path d="M170 440 V504" stroke="#4a5864" stroke-width="6" marker-end="url(#arr)"/>
<text x="190" y="479.0" font-size="19" font-style="italic">csak előkészítve mehet tovább</text>
<rect x="60" y="512" width="480" height="162" rx="14" fill="#e4efdc" stroke="#3c7a3a" stroke-width="3"/>
<text x="300.0" y="546" font-size="22" font-weight="bold" text-anchor="middle" fill="#3c7a3a">Népgyűlés, a legfőbb szerv</text>
<text x="300.0" y="576" font-size="20" text-anchor="middle">tagja minden 20. évét</text>
<text x="300.0" y="602" font-size="20" text-anchor="middle">betöltött athéni polgár;</text>
<text x="300.0" y="628" font-size="20" text-anchor="middle">vita, majd szavazás:</text>
<text x="300.0" y="654" font-size="20" text-anchor="middle">kézfelemelés vagy kavics az urnába</text>
<path d="M170 680 V744" stroke="#4a5864" stroke-width="6" marker-end="url(#arr)"/>
<text x="190" y="719.0" font-size="19" font-style="italic">a népgyűlés dönt</text>
