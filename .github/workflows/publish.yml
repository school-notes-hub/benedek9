name: Publish reviewed study site
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Reviewed public Release tag
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout pinned public verifier
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: school-notes-hub/llm-school-notes-template
          ref: 72e52e3e1b8178de68faa792f838482d789308d7
          path: renderer
          persist-credentials: false
          sparse-checkout: packages/study-site
      - name: Download and verify reviewed bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SITE_REPO: ${{ github.repository }}
        run: |
          mkdir release
          gh release download "$RELEASE_TAG" --repo "$SITE_REPO" --pattern site.tar.gz --pattern site.tar.gz.sha256 --dir release
          python3 renderer/packages/study-site/release-bundle.py verify release/site.tar.gz site "/${SITE_REPO##*/}/" "$RELEASE_TAG"
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload verified public site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
