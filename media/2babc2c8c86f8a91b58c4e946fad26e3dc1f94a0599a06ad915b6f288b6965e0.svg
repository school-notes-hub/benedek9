<text text-anchor="middle" x="176" y="-254" font-family="DejaVu Sans" font-size="20.00" fill="#203c3c">ANONYMUS</text>
<text text-anchor="middle" x="176" y="-232" font-family="DejaVu Sans" font-size="20.00" fill="#203c3c">Gesta Hungarorum</text>
<text text-anchor="middle" x="176" y="-186" font-family="DejaVu Sans" font-size="20.00" fill="#203c3c">Szkítia, Álmos,</text>
<text text-anchor="middle" x="176" y="-164" font-family="DejaVu Sans" font-size="20.00" fill="#203c3c">Emese turulos álma</text>
<text text-anchor="middle" x="176" y="-118" font-family="DejaVu Sans" font-size="20.00" fill="#203c3c">Emese álmában</text>
<text text-anchor="middle" x="176" y="-96" font-family="DejaVu Sans" font-size="20.00" fill="#203c3c">turulmadár jelenik meg.</text>
</g>


