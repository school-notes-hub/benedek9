<svg xmlns="http://www.w3.org/2000/svg" width="400" height="436" viewBox="0 0 400 436" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Ha a várandós munkavállaló egészségi állapota miatt nem dolgozhat a munkakörében: megfelelő munkakör felajánlása, vagy felmentés alapbérrel</title>
<defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#44516a"/></marker></defs>
<rect width="400" height="436" rx="16" fill="#f7f9fc"/>
<text x="200" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#23395d">A várandós munkavállaló védelme</text>
<rect x="20" y="50" width="360" height="80" rx="10" fill="#e8f1fb" stroke="#3f7fd6" stroke-width="2"/>
<text x="200" y="74" text-anchor="middle" font-size="14" font-weight="700" fill="#23395d">Orvosi vélemény szerint</text>
<text x="200" y="95" text-anchor="middle" font-size="14" fill="#23395d">egészségi állapota miatt nem</text>
<text x="200" y="115" text-anchor="middle" font-size="14" fill="#23395d">dolgozhat a munkakörében</text>
<line x1="200" y1="130" x2="200" y2="158" stroke="#44516a" stroke-width="2.5" marker-end="url(#h)"/>
<rect x="40" y="160" width="320" height="58" rx="10" fill="#fff8d6" stroke="#c9a227" stroke-width="2"/>
<text x="200" y="184" text-anchor="middle" font-size="14" font-weight="700" fill="#23395d">Van az állapotának megfelelő</text>
<text x="200" y="204" text-anchor="middle" font-size="14" font-weight="700" fill="#23395d">munkakör?</text>
<line x1="120" y1="218" x2="104" y2="254" stroke="#44516a" stroke-width="2.5" marker-end="url(#h)"/>
<line x1="280" y1="218" x2="296" y2="254" stroke="#44516a" stroke-width="2.5" marker-end="url(#h)"/>
<text x="92" y="242" text-anchor="end" font-size="14" font-style="italic" font-weight="700" fill="#2a8c7e">van</text>
<text x="308" y="242" text-anchor="start" font-size="14" font-style="italic" font-weight="700" fill="#c2611f">nincs</text>
<rect x="15" y="256" width="175" height="118" rx="10" fill="#e6f4f1" stroke="#2a8c7e" stroke-width="2"/>
<text x="102.5" y="280" text-anchor="middle" font-size="14" font-weight="700" fill="#23395d">A munkáltató</text>
<text x="102.5" y="300" text-anchor="middle" font-size="14" font-weight="700" fill="#23395d">felajánlja neki</text>
<text x="102.5" y="322" text-anchor="middle" font-size="14" fill="#23395d">Ha elfogadja: alapbére</text>
<text x="102.5" y="342" text-anchor="middle" font-size="14" fill="#23395d">legalább a szerződés</text>
<text x="102.5" y="362" text-anchor="middle" font-size="14" fill="#23395d">szerinti alapbér</text>
<rect x="210" y="256" width="175" height="78" rx="10" fill="#fff0e6" stroke="#e07b39" stroke-width="2"/>
<text x="297.5" y="280" text-anchor="middle" font-size="14" font-weight="700" fill="#23395d">A munkáltató</text>
<text x="297.5" y="300" text-anchor="middle" font-size="14" font-weight="700" fill="#23395d">felmenti</text>
<text x="297.5" y="320" text-anchor="middle" font-size="14" fill="#23395d">a munkavégzés alól</text>
<line x1="297.5" y1="334" x2="297.5" y2="362" stroke="#44516a" stroke-width="2.5" marker-end="url(#h)"/>
<rect x="210" y="364" width="175" height="58" rx="10" fill="#fff0e6" stroke="#e07b39" stroke-width="2"/>
<text x="297.5" y="388" text-anchor="middle" font-size="14" fill="#23395d">Erre az időre</text>
<text x="297.5" y="408" text-anchor="middle" font-size="14" font-weight="700" fill="#23395d">jár az alapbér</text>
</svg>