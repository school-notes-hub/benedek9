<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 562" width="440" height="562" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="A javak csoportosítása fa-szerkezetben: a javak szabad és gazdasági javak; a gazdasági javak anyagi és nem anyagi javak; az anyagi javak termelési eszközök és fogyasztási cikkek; a nem anyagi javak (szolgáltatások) anyagi jellegű és nem anyagi jellegű szolgáltatások">
  <rect width="440" height="562" rx="16" fill="#fdfaf3"/>
  <rect x="12" y="12" width="418" height="40" rx="11" fill="#145a32"/><text x="28" y="39" font-size="20" font-weight="bold" fill="#fff">Javak</text><path d="M28,52 V88.0 H46" fill="none" stroke="#566573" stroke-width="2.5"/><rect x="46" y="62" width="384" height="52" rx="11" fill="#2471a3"/><text x="60" y="84" font-size="16" font-weight="bold" fill="#fff">Szabad javak</text><text x="60" y="104" font-size="14" fill="#fff">pl. víz, levegő, tenger, napfény</text><path d="M28,52 V150.0 H46" fill="none" stroke="#566573" stroke-width="2.5"/><rect x="46" y="124" width="384" height="52" rx="11" fill="#1e8449"/><text x="60" y="146" font-size="16" font-weight="bold" fill="#fff">Gazdasági javak</text><text x="60" y="166" font-size="14" fill="#fff">szűkösek (sokuk termeléssel jön létre)</text><path d="M62,176 V212.0 H80" fill="none" stroke="#566573" stroke-width="2.5"/><rect x="80" y="186" width="350" height="52" rx="11" fill="#ca6f1e"/><text x="94" y="208" font-size="16" font-weight="bold" fill="#fff">Anyagi javak</text><text x="94" y="228" font-size="14" fill="#fff">dologi formát öltenek</text><path d="M96,238 V274.0 H114" fill="none" stroke="#566573" stroke-width="2.5"/><rect x="114" y="248" width="316" height="52" rx="11" fill="#dc7633"/><text x="128" y="270" font-size="16" font-weight="bold" fill="#fff">Termelési eszközök</text><text x="128" y="290" font-size="14" fill="#fff">pl. gép, gyár, traktor, teherautó</text><path d="M96,238 V336.0 H114" fill="none" stroke="#566573" stroke-width="2.5"/><rect x="114" y="310" width="316" height="52" rx="11" fill="#dc7633"/><text x="128" y="332" font-size="16" font-weight="bold" fill="#fff">Fogyasztási cikkek</text><text x="128" y="352" font-size="14" fill="#fff">pl. ruha, étel, ital, cipő</text><path d="M62,176 V398.0 H80" fill="none" stroke="#566573" stroke-width="2.5"/><rect x="80" y="372" width="350" height="52" rx="11" fill="#7d3c98"/><text x="94" y="394" font-size="16" font-weight="bold" fill="#fff">Nem anyagi javak (szolgáltatások)</text><text x="94" y="414" font-size="14" fill="#fff">nem öltenek dologi formát</text><path d="M96,424 V460.0 H114" fill="none" stroke="#566573" stroke-width="2.5"/><rect x="114" y="434" width="316" height="52" rx="11" fill="#a569bd"/><text x="128" y="456" font-size="16" font-weight="bold" fill="#fff">Anyagi jellegű szolgáltatások</text><text x="128" y="476" font-size="14" fill="#fff">termékhez kapcsolódik: pl. telefonszerviz</text><path d="M96,424 V522.0 H114" fill="none" stroke="#566573" stroke-width="2.5"/><rect x="114" y="496" width="316" height="52" rx="11" fill="#a569bd"/><text x="128" y="518" font-size="16" font-weight="bold" fill="#fff">Nem anyagi jellegű szolgáltatások</text><text x="128" y="538" font-size="14" fill="#fff">közvetlenül emberrel: pl. fodrász, fogorvos</text>
</svg>