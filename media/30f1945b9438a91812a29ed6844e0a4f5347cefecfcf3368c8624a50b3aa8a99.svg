<svg xmlns="http://www.w3.org/2000/svg" width="400" height="428" viewBox="0 0 400 428" role="img" aria-label="Két átfedő kör az U = 30 fős osztályban: Z (zongorázók) és H (hegedülők). Csak Z 13, mindkettő 2, csak H 4, egyik sem 11 fő. Alatta: |Z| = 13 + 2 = 15, |H| = 2 + 4 = 6, legalább az egyiken 15 + 6 − 2 = 19, egyiken sem 30 − 19 = 11.">
<title>Két átfedő kör az U = 30 fős osztályban: Z (zongorázók) és H (hegedülők). Csak Z 13, mindkettő 2, csak H 4, egyik sem 11 fő. Alatta: |Z| = 13 + 2 = 15, |H| = 2 + 4 = 6, legalább az egyiken 15 + 6 − 2 = 19, egyiken sem 30 − 19 = 11.</title>
<rect width="400" height="428" rx="12" fill="#fffaf0"/>
<text x="200" y="30" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" font-style="normal" fill="#17283d">Zongorázók és hegedülők</text>
<rect x="14" y="44" width="372" height="236" rx="8" fill="none" stroke="#17283d" stroke-width="2.5"/>
<text x="26" y="70" font-family="DejaVu Sans, sans-serif" font-size="16" text-anchor="start" font-weight="bold" font-style="normal" fill="#17283d">U: 30 fő</text>
<g stroke-width="3" fill-opacity="0.25"><circle cx="150" cy="168" r="92" fill="#e67e22" stroke="#b9590d"/><circle cx="250" cy="168" r="92" fill="#3498db" stroke="#2471a3"/></g>
<text x="70" y="96" font-family="DejaVu Sans, sans-serif" font-size="20" text-anchor="middle" font-weight="bold" font-style="normal" fill="#b9590d">Z</text>
<text x="330" y="96" font-family="DejaVu Sans, sans-serif" font-size="20" text-anchor="middle" font-weight="bold" font-style="normal" fill="#2471a3">H</text>
<text x="103" y="177" font-family="DejaVu Sans, sans-serif" font-size="24" text-anchor="middle" font-weight="bold" font-style="normal" fill="#17283d">13</text>
<text x="200" y="177" font-family="DejaVu Sans, sans-serif" font-size="24" text-anchor="middle" font-weight="bold" font-style="normal" fill="#17283d">2</text>
<text x="297" y="177" font-family="DejaVu Sans, sans-serif" font-size="24" text-anchor="middle" font-weight="bold" font-style="normal" fill="#17283d">4</text>
<text x="340" y="244" font-family="DejaVu Sans, sans-serif" font-size="22" text-anchor="middle" font-weight="bold" font-style="normal" fill="#17283d">11</text>
<text x="340" y="266" font-family="DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" font-style="normal" fill="#17283d">egyik sem</text>
<text x="22" y="306" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="start" font-weight="normal" font-style="normal" fill="#4a5a6a">Z: zongorázók, H: hegedülők</text>
<text x="22" y="332" font-family="DejaVu Sans, sans-serif" font-size="16" text-anchor="start" font-weight="normal" font-style="normal" fill="#17283d">|Z| = 13 + 2 = 15</text>
<text x="22" y="356" font-family="DejaVu Sans, sans-serif" font-size="16" text-anchor="start" font-weight="normal" font-style="normal" fill="#17283d">|H| = 2 + 4 = 6</text>
<text x="22" y="380" font-family="DejaVu Sans, sans-serif" font-size="16" text-anchor="start" font-weight="bold" font-style="normal" fill="#17283d">Legalább az egyiken: 15 + 6 − 2 = 19</text>
<text x="22" y="404" font-family="DejaVu Sans, sans-serif" font-size="16" text-anchor="start" font-weight="bold" font-style="normal" fill="#17283d">Egyiken sem: 30 − 19 = 11</text>
</svg>