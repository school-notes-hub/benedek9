<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1030" viewBox="0 0 720 1030" role="img" aria-labelledby="title desc">
<title id="title">Mezopotámia tájai és városai</title>
<desc id="desc">Tájékozódási séma. Északon Asszíria, középen Akkád Babilonnal, délen Sumer Urukkal és Urral. Nyugaton az Eufrátesz, keleten a Tigris, délen a Perzsa-öböl. A nyersanyagok beszerzési irányai külön listában.</desc>
<rect width="720" height="1030" rx="20" fill="#fffdf7"/>
<g font-family="DejaVu Sans, sans-serif" fill="#172d35">
<text x="36" y="48" font-size="34" font-weight="bold">Mezopotámia tájai</text>
<text x="36" y="87" font-size="26">Kr. e. 3–2. évezred</text>
<text x="360" y="138" text-anchor="middle" font-size="28" font-weight="bold">ÉSZAK</text>
<rect x="134" y="160" width="452" height="134" rx="15" fill="#e8efe1"/>
<rect x="134" y="306" width="452" height="128" rx="15" fill="#f5e8c9"/>
<rect x="134" y="446" width="452" height="156" rx="15" fill="#f5ddd1"/>
<path d="M162 170 V632 M558 170 V632" stroke="#187d9f" stroke-width="6" fill="none"/>
<text x="98" y="410" transform="rotate(-90 98 410)" font-size="28" fill="#126480">Eufrátesz</text>
<text x="624" y="295" transform="rotate(90 624 295)" font-size="28" fill="#126480">Tigris</text>
<text x="360" y="225" text-anchor="middle" font-size="34" font-weight="bold">ASSZÍRIA</text>
<text x="360" y="264" text-anchor="middle" font-size="26">északi vidék</text>
<text x="378" y="345" text-anchor="middle" font-size="32" font-weight="bold">AKKÁD</text>
<circle cx="162" cy="389" r="7" fill="#172d35" stroke="#fffdf7" stroke-width="2"/>
<text x="184" y="399" font-size="29">Babilon</text>
<text x="402" y="487" text-anchor="middle" font-size="32" font-weight="bold">SUMER</text>
<circle cx="162" cy="519" r="7" fill="#172d35" stroke="#fffdf7" stroke-width="2"/>
<text x="184" y="529" font-size="29">Uruk</text>
<circle cx="162" cy="570" r="7" fill="#172d35" stroke="#fffdf7" stroke-width="2"/>
<text x="184" y="580" font-size="29">Ur</text>
<rect x="134" y="627" width="452" height="55" rx="14" fill="#d3edf4"/>
<text x="360" y="664" text-anchor="middle" font-size="29" fill="#126480">Perzsa-öböl</text>
<text x="360" y="718" text-anchor="middle" font-size="28" font-weight="bold">DÉL</text>
<path d="M36 759 H78" stroke="#187d9f" stroke-width="6"/>
<text x="94" y="769" font-size="25">folyó</text>
<circle cx="237" cy="759" r="7" fill="#172d35"/>
<text x="256" y="769" font-size="25">város</text>
<text x="36" y="815" font-size="28" font-weight="bold">Honnan hoztak nyersanyagot?</text>
<text x="36" y="858" font-size="26">Fa: nyugatról és keletről.</text>
<text x="36" y="901" font-size="26">Kő: a keleti vidékekről.</text>
<text x="36" y="944" font-size="26">Réz: északról és keletről is.</text>
<text x="36" y="1000" font-size="24" fill="#4b5a5f">Tájékozódási séma, nem méretarányos.</text>
</g>
</svg>