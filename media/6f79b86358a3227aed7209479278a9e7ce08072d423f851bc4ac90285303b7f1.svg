<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 282" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Szembe haladás: A és B 40 km-re van egymástól; A-ból 50 km/h, B-ből 15 perccel később 65 km/h; a T találkozási pontig megtett két út összege 40 km</title>
<rect width="400" height="282" rx="16" fill="#f5f8fb"/>
<text x="200.0" y="30.0" font-size="18" fill="#16283b" text-anchor="middle" font-weight="700">Szembe haladás: 40 km</text>
<line x1="40" y1="110" x2="360" y2="110" stroke="#16283b" stroke-width="3"/>
<circle cx="40" cy="110" r="6" fill="#16283b"/>
<circle cx="360" cy="110" r="6" fill="#16283b"/>
<text x="40.0" y="138.0" font-size="16" fill="#16283b" text-anchor="middle" font-weight="700">A</text>
<text x="360.0" y="138.0" font-size="16" fill="#16283b" text-anchor="middle" font-weight="700">B</text>
<text x="200.0" y="66.0" font-size="15" fill="#16283b" text-anchor="middle" font-weight="400">a teljes távolság: 40 km</text>
<line x1="40.0" y1="88.0" x2="108.0" y2="88.0" stroke="#175e96" stroke-width="4"/><path d="M120.0,88.0 L107.0,95.5 L107.0,80.5 z" fill="#175e96"/>
<text x="40.0" y="80.0" font-size="15" fill="#175e96" text-anchor="start" font-weight="700">50 km/h</text>
<line x1="360.0" y1="88.0" x2="292.0" y2="88.0" stroke="#c4561c" stroke-width="4"/><path d="M280.0,88.0 L293.0,80.5 L293.0,95.5 z" fill="#c4561c"/>
<text x="360.0" y="80.0" font-size="15" fill="#c4561c" text-anchor="end" font-weight="700">65 km/h</text>
<line x1="235.7" y1="98" x2="235.7" y2="122" stroke="#1d7a43" stroke-width="3"/>
<text x="235.7" y="138.0" font-size="16" fill="#1d7a43" text-anchor="middle" font-weight="700">T</text>
<path d="M40,150 L40,158 L233.7,158 L233.7,150" fill="none" stroke="#175e96" stroke-width="2.5"/>
<text x="137.8" y="180.0" font-size="16" fill="#175e96" text-anchor="middle" font-weight="700">s₁</text>
<path d="M237.7,150 L237.7,158 L360,158 L360,150" fill="none" stroke="#c4561c" stroke-width="2.5"/>
<text x="297.8" y="180.0" font-size="16" fill="#c4561c" text-anchor="middle" font-weight="700">s₂</text>
<text x="200.0" y="216.0" font-size="17" fill="#16283b" text-anchor="middle" font-weight="700">s₁ + s₂ = 40 km</text>
<text x="200.0" y="242.0" font-size="15" fill="#4a5568" text-anchor="middle" font-weight="400">a B-ből induló 15 perccel később indul</text>
<text x="200.0" y="262.0" font-size="15" fill="#1d7a43" text-anchor="middle" font-weight="400">T: a találkozás helye</text>
</svg>