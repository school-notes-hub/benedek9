<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" role="img" font-family="DejaVu Sans,sans-serif"><title>Az elődöntőkből a döntőbe és a bronzmérkőzésre</title><rect width="400" height="340" rx="16" fill="#fffaf0"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#34495e"/></marker></defs><rect x="76" y="20" width="248" height="79" rx="10" fill="#e3edf3" stroke="#34495e"/><text x="200" y="48" text-anchor="middle" font-size="21" fill="#20354a" font-weight="700">Elődöntők</text><text x="200" y="78" text-anchor="middle" font-size="18" fill="#20354a" font-weight="400">4 csapat, 2 mérkőzés</text><path d="M140 99 L95 202" stroke="#34495e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M260 99 L305 202" stroke="#34495e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="78" y="143" text-anchor="middle" font-size="16" fill="#20354a" font-weight="400">2 győztes</text><text x="322" y="143" text-anchor="middle" font-size="16" fill="#20354a" font-weight="400">2 vesztes</text><rect x="10" y="210" width="182" height="110" rx="10" fill="#e8f2e9" stroke="#34495e"/><rect x="208" y="210" width="182" height="110" rx="10" fill="#f8eada" stroke="#34495e"/><text x="101" y="240" text-anchor="middle" font-size="21" fill="#20354a" font-weight="700">Döntő</text><text x="101" y="268" text-anchor="middle" font-size="18" fill="#20354a" font-weight="400">I-II. hely</text><text x="101" y="299" text-anchor="middle" font-size="17" fill="#20354a" font-weight="400">1 mérkőzés</text><text x="299" y="240" text-anchor="middle" font-size="17" fill="#20354a" font-weight="700">Bronzmérkőzés</text><text x="299" y="268" text-anchor="middle" font-size="18" fill="#20354a" font-weight="400">III-IV. hely</text><text x="299" y="299" text-anchor="middle" font-size="17" fill="#20354a" font-weight="400">1 mérkőzés</text></svg>