
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 560" width="390" height="560" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
  <title>Jellemtérkép: Sherlock Holmes</title>
  <desc>Középen Sherlock Holmes, körülötte négy tulajdonság; mindegyik alatt a tett, amely igazolja.</desc>
  <rect width="390" height="560" fill="#fbf8f2"/>
  <text x="195" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#2b2a33">Jellemtérkép: Sherlock Holmes</text>
  
  <rect x="44" y="47" width="16" height="16" rx="3" fill="#7a3b4c"/>
  <text x="66" y="60" font-size="13.5" fill="#2b2a33">tulajdonság</text>
  <rect x="166" y="47" width="16" height="16" rx="3" fill="#ffffff" stroke="#7a3b4c" stroke-width="1.5"/>
  <text x="188" y="60" font-size="13.5" fill="#2b2a33">a tett, amely igazolja</text>
  
  <g stroke="#7a3b4c" stroke-width="2.5">
    <line x1="195" y1="290" x2="120" y2="243"/>
    <line x1="195" y1="290" x2="270" y2="243"/>
    <line x1="195" y1="290" x2="120" y2="337"/>
    <line x1="195" y1="290" x2="270" y2="337"/>
  </g>
  
  <g>
    <rect x="8" y="78" width="182" height="165" rx="10" fill="#ffffff" stroke="#7a3b4c" stroke-width="1.5"/>
    <path d="M8 88 a10 10 0 0 1 10 -10 h162 a10 10 0 0 1 10 10 v34 h-182 z" fill="#7a3b4c"/>
    <text x="99" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Megfigyelőképesség</text>
    <text font-size="14" fill="#2b2a33">
      <tspan x="18" y="144">Az üres szobában</tspan>
      <tspan x="18" y="161">megvizsgálja a</tspan>
      <tspan x="18" y="178">tetőablakot, a tetőn</tspan>
      <tspan x="18" y="195">észreveszi az ereszhez</tspan>
      <tspan x="18" y="212">támasztott létrát.</tspan>
    </text>
  </g>
  
  <g>
    <rect x="200" y="78" width="182" height="165" rx="10" fill="#ffffff" stroke="#7a3b4c" stroke-width="1.5"/>
    <path d="M200 88 a10 10 0 0 1 10 -10 h162 a10 10 0 0 1 10 10 v34 h-182 z" fill="#7a3b4c"/>
    <text x="291" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">
      <tspan x="291" y="97">Tudományos</tspan>
      <tspan x="291" y="114">gondolkodás</tspan>
    </text>
    <text font-size="14" fill="#2b2a33">
      <tspan x="210" y="144">A haj, a ruha és az</tspan>
      <tspan x="210" y="161">ablaknál ültetés</tspan>
      <tspan x="210" y="178">összefüggéséből</tspan>
      <tspan x="210" y="195">következtet: Violet</tspan>
      <tspan x="210" y="212">egy másik nőt</tspan>
      <tspan x="210" y="229">személyesít meg.</tspan>
    </text>
  </g>
  
  <ellipse cx="195" cy="290" rx="92" ry="30" fill="#2f4a6d"/>
  <text x="195" y="296" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">Sherlock Holmes</text>
  
  <g>
    <rect x="8" y="337" width="182" height="165" rx="10" fill="#ffffff" stroke="#7a3b4c" stroke-width="1.5"/>
    <path d="M8 347 a10 10 0 0 1 10 -10 h162 a10 10 0 0 1 10 10 v34 h-182 z" fill="#7a3b4c"/>
    <text x="99" y="365" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Igazságérzet</text>
    <text font-size="14" fill="#2b2a33">
      <tspan x="18" y="403">Alice-t veszélyben</tspan>
      <tspan x="18" y="420">hiszi, ezért Watsonnal</tspan>
      <tspan x="18" y="437">feltöri a bezárt szoba</tspan>
      <tspan x="18" y="454">ajtaját, hogy segítsen</tspan>
      <tspan x="18" y="471">neki.</tspan>
    </text>
  </g>
  
  <g>
    <rect x="200" y="337" width="182" height="165" rx="10" fill="#ffffff" stroke="#7a3b4c" stroke-width="1.5"/>
    <path d="M200 347 a10 10 0 0 1 10 -10 h162 a10 10 0 0 1 10 10 v34 h-182 z" fill="#7a3b4c"/>
    <text x="291" y="365" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Elhivatottság</text>
    <text font-size="14" fill="#2b2a33">
      <tspan x="210" y="403">Violet távirata után</tspan>
      <tspan x="210" y="420">másnap Watsonnal</tspan>
      <tspan x="210" y="437">Winchesterbe utazik,</tspan>
      <tspan x="210" y="454">hogy segítsen neki.</tspan>
    </text>
  </g>
  <text x="195" y="530" text-anchor="middle" font-size="14" fill="#2b2a33">Előbb a tulajdonság, aztán a tett,</text>
  <text x="195" y="548" text-anchor="middle" font-size="14" fill="#2b2a33">amelyből következtetsz rá.</text>
</svg>