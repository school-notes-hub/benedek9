<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Oxigén kimutatása: hidrogén-peroxid-oldat barnakővel, oxigénbuborékokkal; a parázsló gyújtópálca lángra lobban</title>
  <rect width="400" height="400" rx="16" fill="#f2faf4"/>
  <text x="20" y="38" font-size="22" font-weight="800" fill="#1d5c46">Oxigén kimutatása</text>
  <line x1="98" y1="96" x2="180" y2="56" stroke="#b07a3a" stroke-width="6" stroke-linecap="round"/>
  <path d="M98,98 q-14,-12 -4,-34 q4,10 9,6 q4,-10 12,-14 q-2,14 4,22 q-6,16 -21,20 z" fill="#ff9f1c"/><path d="M98,94 q-6,-6 -1,-16 q4,6 7,3 q2,8 -6,13 z" fill="#ffe39a"/>
  <path d="M82,120 H118 V170 L160,262 q10,22 -14,22 H54 q-24,0 -14,-22 L82,170 Z" fill="#fff" stroke="#5a6b78" stroke-width="4" stroke-linejoin="round"/>
  <path d="M63,214 H137 L157,258 q6,16 -11,16 H54 q-17,0 -11,-16 Z" fill="#d6ebff"/>
  <g fill="#5b4636"><circle cx="72" cy="264" r="6"/><circle cx="92" cy="268" r="5"/><circle cx="110" cy="264" r="6"/><circle cx="128" cy="268" r="5"/></g>
  <g fill="none" stroke="#9cc8ea" stroke-width="2"><circle cx="96" cy="232" r="5"/><circle cx="108" cy="212" r="4"/><circle cx="95" cy="184" r="4"/><circle cx="104" cy="152" r="3.5"/><circle cx="96" cy="132" r="3"/></g>
  <g font-size="15" fill="#333">
    <line x1="186" y1="60" x2="212" y2="64" stroke="#888" stroke-width="1.5"/>
    <text x="216" y="56" font-weight="700">parázsló</text><text x="216" y="75" font-weight="700">gyújtópálca:</text><text x="216" y="94">oxigénben újra</text><text x="216" y="113">lángra lobban</text>
    <line x1="114" y1="170" x2="212" y2="160" stroke="#888" stroke-width="1.5"/>
    <text x="216" y="156" font-weight="700">buborékok:</text><text x="216" y="175">oxigén (O<tspan dy="4.5" font-size="12.5">2</tspan><tspan dy="-4.5">)</tspan></text>
    <line x1="150" y1="240" x2="212" y2="216" stroke="#888" stroke-width="1.5"/>
    <text x="216" y="212" font-weight="700" fill="#2a6fa8">hidrogén-peroxid</text><text x="216" y="231">(H<tspan dy="4.5" font-size="12.5">2</tspan><tspan dy="-4.5">O</tspan><tspan dy="4.5" font-size="12.5">2</tspan><tspan dy="-4.5">) oldata</tspan></text>
    <line x1="134" y1="266" x2="212" y2="272" stroke="#888" stroke-width="1.5"/>
    <text x="216" y="268" font-weight="700" fill="#5b4636">barnakő (MnO<tspan dy="4.5" font-size="12.5">2</tspan><tspan dy="-4.5">):</tspan></text><text x="216" y="287">nem fogy el,</text><text x="216" y="306">csak gyorsít</text>
  </g>
  <text x="20" y="338" font-size="17" fill="#1d5c46">2 H<tspan dy="5.1" font-size="12.5">2</tspan><tspan dy="-5.1">O</tspan><tspan dy="5.1" font-size="12.5">2</tspan><tspan dy="-5.1"> → 2 H</tspan><tspan dy="5.1" font-size="12.5">2</tspan><tspan dy="-5.1">O + O</tspan><tspan dy="5.1" font-size="12.5">2</tspan></text>
  <text x="20" y="364" font-size="15" fill="#1d5c46">a barnakő (MnO<tspan dy="4.5" font-size="12.5">2</tspan><tspan dy="-4.5">) katalizátor</tspan></text>
</svg>