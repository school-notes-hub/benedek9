<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Három hőmérő: Celsius, kelvin és Fahrenheit skála egymás mellett</title>
  <rect width="820" height="470" rx="18" fill="#f4f8ff"/>
  <text x="410" y="42" text-anchor="middle" font-size="26" font-weight="800" fill="#23395d">Ugyanaz a hőmérséklet, három skálán</text>
  <text x="410" y="65" text-anchor="middle" font-size="13" fill="#555">A víz fagyás- és forráspontja normál légköri nyomáson értendő.</text>
  
  <g font-size="14" fill="#555">
    <line x1="60" y1="110" x2="760" y2="110" stroke="#e25c4b" stroke-dasharray="6 5"/><text x="60" y="102" fill="#e25c4b" font-weight="700">a víz forr</text>
    <line x1="60" y1="270" x2="760" y2="270" stroke="#2ea99a" stroke-dasharray="6 5"/><text x="60" y="262" fill="#2ea99a" font-weight="700">szobahőmérséklet</text>
    <line x1="60" y1="310" x2="760" y2="310" stroke="#3f7fd6" stroke-dasharray="6 5"/><text x="60" y="330" fill="#3f7fd6" font-weight="700">a víz megfagy</text>
  </g>
  <g id="th">
  </g>
  
  <g>
    <rect x="262" y="80" width="26" height="290" rx="13" fill="#ffffff" stroke="#667" stroke-width="3"/><circle cx="275" cy="385" r="24" fill="#e25c4b" stroke="#667" stroke-width="3"/><rect x="268" y="270" width="14" height="105" fill="#e25c4b"/>
    <rect x="442" y="80" width="26" height="290" rx="13" fill="#ffffff" stroke="#667" stroke-width="3"/><circle cx="455" cy="385" r="24" fill="#e25c4b" stroke="#667" stroke-width="3"/><rect x="448" y="270" width="14" height="105" fill="#e25c4b"/>
    <rect x="622" y="80" width="26" height="290" rx="13" fill="#ffffff" stroke="#667" stroke-width="3"/><circle cx="635" cy="385" r="24" fill="#e25c4b" stroke="#667" stroke-width="3"/><rect x="628" y="270" width="14" height="105" fill="#e25c4b"/>
  </g>
  <g font-size="17" font-weight="700" fill="#23395d" paint-order="stroke" stroke="#f4f8ff" stroke-width="7" stroke-linejoin="round">
    <text x="300" y="116">100 °C</text><text x="300" y="276">20 °C</text><text x="300" y="316">0 °C</text>
    <text x="480" y="116">373,15 K</text><text x="480" y="276">293,15 K</text><text x="480" y="316">273,15 K</text>
    <text x="660" y="116">212 °F</text><text x="660" y="276">68 °F</text><text x="660" y="316">32 °F</text>
  </g>
  <g font-size="18" font-weight="800" text-anchor="middle">
    <text x="275" y="440" fill="#e2733d">Celsius</text><text x="455" y="440" fill="#6a5acd">Kelvin</text><text x="635" y="440" fill="#2e8b57">Fahrenheit</text>
  </g>
  <text x="455" y="462" text-anchor="middle" font-size="13" fill="#555">Mérőszámok: kelvin = Celsius + 273,15 · Fahrenheit = Celsius · 1,8 + 32</text>
</svg>