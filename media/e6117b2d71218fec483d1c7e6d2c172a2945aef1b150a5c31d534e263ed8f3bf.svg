<svg xmlns="http://www.w3.org/2000/svg" width="420" height="250" viewBox="0 0 420 250" role="img" aria-label="Ismeretségi gráf három csúccsal: Anna és Béla, valamint Béla és Cili között van él; Anna és Cili között nincs.">
<title>Ismeretségi gráf: három ember, két ismeretség</title>
<rect width="420" height="250" rx="14" fill="#fffaf0"/>
<text x="210" y="34" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#15354d" text-anchor="middle">Ismeretségi gráf</text>
<g stroke="#384d5c" stroke-width="3.5" stroke-linecap="round">
<line x1="215" y1="85" x2="105" y2="195"/>
<line x1="105" y1="195" x2="330" y2="195"/>
</g>
<g fill="#15354d"><circle cx="215" cy="85" r="8"/><circle cx="105" cy="195" r="8"/><circle cx="330" cy="195" r="8"/></g>
<g font-family="DejaVu Sans, sans-serif" font-size="21" fill="#17283d">
<text x="228" y="76">Anna</text>
<text x="91" y="202" text-anchor="end">Béla</text>
<text x="344" y="202">Cili</text>
</g>
</svg>