<svg xmlns="http://www.w3.org/2000/svg" width="600" height="807" viewBox="0 0 600 807" role="img" aria-labelledby="title desc">
<title id="title">Kína két nagy folyója</title>
<desc id="desc">Tájékozódási térkép mai partvonallal. Északon a Sárga-folyó, mellette sárga kiemeléssel az első államok térsége (Kr. e. 2. évezred); délebbre a Jangce, alsó szakaszán zöld kiemeléssel a rizsföldek. A térkép északi szélén: nomád törzsek.</desc>
<rect width="600" height="807" fill="#fffdf7"/>
