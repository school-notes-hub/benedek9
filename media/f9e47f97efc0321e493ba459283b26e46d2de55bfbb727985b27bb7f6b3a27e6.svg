<svg xmlns="http://www.w3.org/2000/svg" width="440" height="460" viewBox="0 0 440 460" role="img" aria-labelledby="title desc">
  <title id="title">Az irodalomhoz kapcsolódó fogalmak</title>
  <desc id="desc">Saját szemléltető ábra a füzet felsorolásához: szépirodalom, világirodalom, irodalomtudomány, szakirodalom. A fogalmak átfedhetnek.</desc>
  <rect width="440" height="460" rx="20" fill="#f5f3ff"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#30214d">
    <text x="220" y="34" font-size="15">Saját szemléltető ábra</text>
    <rect x="105" y="53" width="230" height="62" rx="14" fill="#6d28d9"/>
    <text x="220" y="92" font-size="25" font-weight="bold" fill="white">Irodalom</text>
    <path d="M105 84 H51 V376 M51 169 H92 M51 238 H92 M51 307 H92 M51 376 H92" fill="none" stroke="#8b5cf6" stroke-width="3"/>
    <rect x="92" y="141" width="303" height="55" rx="12" fill="#ede9fe" stroke="#c4b5fd"/>
    <text x="243" y="176" font-size="22">Szépirodalom</text>
    <rect x="92" y="210" width="303" height="55" rx="12" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="243" y="245" font-size="22">Világirodalom</text>
    <rect x="92" y="279" width="303" height="55" rx="12" fill="#dcfce7" stroke="#86efac"/>
    <text x="243" y="314" font-size="22">Irodalomtudomány</text>
    <rect x="92" y="348" width="303" height="55" rx="12" fill="#ffedd5" stroke="#fdba74"/>
    <text x="243" y="383" font-size="22">Szakirodalom</text>
    <text x="220" y="436" font-size="17">A fogalmak átfedhetnek.</text>
  </g>
</svg>